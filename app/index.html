<!-- Installable: with these, a phone offers "Add to Home screen", and launched from that icon
     the app runs without the browser's address bar. Harmless from file:// and in a plain tab. -->
<link rel="manifest" href="manifest.webmanifest?v=20260909.11">
<meta name="theme-color" content="#100e1a">
<link rel="apple-touch-icon" href="img/icon-192.png?v=20260909.11">

<!-- boot sequence -->
<div id="boot">
  <div class="blogo">#GRID</div>
  <div class="blines" id="boot-lines"></div>
</div>

<div class="os" id="os" style="display:none">
  <!-- top bar -->
  <header class="os-topbar">
    <div class="os-logo"><span class="os-badge"><svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M 117.5 117.5 H 360.5 L 394.5 151.5 V 394.5 H 150.5 L 117.5 361.5 Z M 128.5 128.5 V 355.5 L 156.5 383.5 H 383.5 V 156.5 L 355.5 128.5 Z"/><polygon points="220.5,178.5 243.5,178.5 219,333.5 195.5,333.5"/><polygon points="292.5,178.5 315.5,178.5 291,333.5 267.5,333.5"/><rect x="178.5" y="216.5" width="155" height="24"/><rect x="178.5" y="271.5" width="155" height="24"/></svg></span>#GRID<b>OS</b> <span class="v">v1.0</span></div>
    <div class="os-status">
      <span><span class="led"></span>LINK STABLE</span>
      <span id="save-state">SYNC OK</span>
    </div>
    <div class="os-spacer"></div>
    <div class="os-status" id="active-name">NO FREELANCER LOADED</div>
    <div class="os-clock" id="os-clock">--:--:--</div>
  </header>

  <!-- tab rail -->
  <nav class="os-tabs" id="os-tabs"></nav>

  <!-- The Explorer toolbar, drawn by the '98 skin alone (.win-bar in theme.css) and inert
       everywhere else. It sits between the title bar and the page because that is where
       Windows put a toolbar. The buttons are furniture; the address is not, and app.js
       writes the open view into it on every render. -->
  <div class="win-bar" aria-hidden="true">
    <div class="wb-in">
      <div class="wb-tools">
        <span class="wb-b" data-ico="back">Back</span>
        <span class="wb-b" data-ico="fwd">Forward</span>
        <span class="wb-b" data-ico="up">Up</span>
        <span class="wb-sep"></span>
        <span class="wb-b" data-ico="cut"></span>
        <span class="wb-b" data-ico="copy"></span>
        <span class="wb-b" data-ico="paste"></span>
        <span class="wb-b" data-ico="undo"></span>
        <span class="wb-sep"></span>
        <span class="wb-b" data-ico="del"></span>
        <span class="wb-b" data-ico="props"></span>
        <!-- the groove that survives a narrow window, since the two groups either side of it
             are the two that stay: the navigation trio and the view switch -->
        <span class="wb-sep wb-sep-keep"></span>
        <span class="wb-b" data-ico="views"></span>
      </div>
      <div class="wb-addr">
        <span class="wb-lab">Address</span>
        <span class="wb-box"><span class="wb-ico"></span><span class="wb-path" id="win-addr">C:\GRIDOS</span><span class="wb-drop"></span></span>
        <span class="wb-go">Go</span>
      </div>
    </div>
  </div>

  <!-- main mount -->
  <main class="os-main" id="view"></main>

  <!-- The hit counter every 90s page carried, shown only by the '98 skin. The number is REAL:
       times this app has been opened on this device, counted in app.js. A made-up "009341" would
       have been the easier joke and a worse one, since everything else on this sheet is true. -->
  <div class="win-counter" id="win-counter" aria-hidden="true">
    <span class="wc-digits" id="wc-digits"></span>
    <span class="wc-label">visitors since 1998</span>
  </div>
</div>

<div class="toast" id="toast"></div>
