<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104" width="480" height="416" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Bad Sector</title>
<desc id="desc">Gremlin Gizmo at work. A tidy green data square rises past his right side. He winds up and hip-checks it with the kink in his side. It turns rust and tumbles away, and he cackles. He does the same to a second square. A third rises and stops beside him. He only glares at it with narrowed eyes. It cracks, turns rust, and drops on its own. He cackles. Four and a half second loop on a transparent background.</desc>
<style>
