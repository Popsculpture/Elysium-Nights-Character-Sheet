.pose{animation:pose 4.5s ease-in-out infinite}.shake{animation:shake 4.5s steps(1,end) infinite}.look{animation:look 4.5s steps(1,end) infinite}.lids{animation:lids 4.5s steps(1,end) infinite}.brows{animation:brows 4.5s steps(1,end) infinite}
