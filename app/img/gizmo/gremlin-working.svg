@keyframes shake{0%{transform:rotate(0)}30.000%{transform:rotate(5deg)}31.111%{transform:rotate(-5deg)}32.222%{transform:rotate(5deg)}33.333%{transform:rotate(-5deg)}34.444%{transform:rotate(5deg)}35.556%{transform:rotate(0)}93.333%{transform:rotate(5deg)}94.444%{transform:rotate(-5deg)}95.556%{transform:rotate(5deg)}96.667%{transform:rotate(-5deg)}97.778%{transform:rotate(5deg)}98.889%{transform:rotate(-5deg)}100.000%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes look{0%{transform:translate(1.4px,1.8px)}13%{transform:translate(1.4px,0.6px)}22.2%{transform:translate(1.4px,-1px)}30%{transform:translate(0px,0.3px)}36.7%{transform:translate(1.4px,1.8px)}44%{transform:translate(1.4px,0.6px)}52.2%{transform:translate(1.4px,-1px)}58%{transform:translate(1.4px,1.8px)}70%{transform:translate(1.4px,0.9px)}80%{transform:translate(1.4px,0.2px)}88.9%{transform:translate(1.4px,1.6px)}93.3%{transform:translate(0px,0.3px)}100%{transform:translate(0px,0.3px)}}
