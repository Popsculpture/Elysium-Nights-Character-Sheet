<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 130" width="688" height="520" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Home Run</title>
<desc id="desc">Fidget the Gremlin scuttles in, hops up, and bonks Gizmo in the side, then cackles. It does it again, harder, and cackles longer. Gizmo's eye twitches and he gives the viewer a flat look. He pops into a baseball bat. Fidget stops laughing, goes wide-eyed, trembles, and starts edging away. The bat rises, cocks back over Fidget's head, and whips the long way round: out to the left, under, and up. It connects from below with a burst, and Fidget sails up and away into the distance, spinning and shrinking to a dot that ends in a single sparkle. The bat holds its follow-through and watches it go, then stands up and pops back into Gizmo, who dusts himself off and looks satisfied. Eight second loop on a transparent background.</desc>
