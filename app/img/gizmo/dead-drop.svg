82.5%,84.5%{transform:translate(-1px,1.5px)}
86%,88.5%{transform:translate(-1px,-2.4px)}
90.5%,93.5%{transform:translate(-1px,-.3px)}}
@keyframes brows{
0%,3%,91%,100%{transform:translateY(0)}
5%,13%{transform:translateY(-1.5px)}
15%,52%{transform:translateY(.8px)}
60%,75%{transform:translateY(-1px)}
76.5%,84.5%{transform:translateY(1px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Hook over the top edge of the frame. -->
<path class="hook" d="M36 3 V.8 H40.5 V4.5" fill="none" stroke="#2ee6a0" stroke-width="1.5"/>
<g class="tug" fill="#e9f1fb"><rect x="31" y="91" width="2" height="1.5"/><rect x="39.5" y="91" width="2" height="1.5"/></g>
<g transform="translate(4 10)">
<g class="rappel"><g class="shk"><g class="pose">
<!-- His own wire, thin, running up out of frame. -->
<path class="wire" d="M32 8 V-150" stroke="#2ee6a0" stroke-width="1.5"/>
<!-- The file rides in his lower curve, behind the wire of his body. -->
<g class="file">
<rect x="33.6" y="51.5" width="8.8" height="11" fill="#3ce0ff" stroke="#07090d" stroke-width=".4"/>
<path d="M39.6 51.5 L42.4 54.3 H39.6 Z" fill="#07090d"/>
<path d="M35.2 55.5 h3.5 M35.2 57.7 h5.5 M35.2 59.9 h4" stroke="#07090d" stroke-width=".7"/>
<rect class="glint" x="42.8" y="49.5" width="1.5" height="1.5" fill="#e9f1fb"/>
</g>
<path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/>
<g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g>
</g></g></g>
<rect class="bt bt0" x="-1.0" y="-1.0" width="2" height="2" fill="#3ce0ff"/><rect class="bt bt1" x="-1.0" y="-1.0" width="2" height="2" fill="#3ce0ff"/><rect class="bt bt2" x="-0.75" y="-0.75" width="1.5" height="1.5" fill="#e9f1fb"/><rect class="bt bt3" x="-0.75" y="-0.75" width="1.5" height="1.5" fill="#3ce0ff"/><rect class="bt bt4" x="-1.0" y="-1.0" width="2" height="2" fill="#e9f1fb"/><rect class="bt bt5" x="-0.75" y="-0.75" width="1.5" height="1.5" fill="#3ce0ff"/>
</g>
</svg>
