58%,60%{transform:translate(0,50px);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
67%,100%{transform:translate(0,0)}}
@keyframes pose{
0%,4.5%,90%,100%{transform:scale(1,1)}
7%{transform:scale(1.06,.9)}
8.5%,86%{transform:scale(.98,1.03)}
87.5%{transform:scale(1.05,.93)}}
@keyframes shk{
0%,67.9%{transform:rotate(0)}
68%{transform:rotate(5deg)}68.6%{transform:rotate(-5deg)}69.3%{transform:rotate(4deg)}69.9%{transform:rotate(-4deg)}
70.5%{transform:rotate(3deg)}71.1%{transform:rotate(-2deg)}71.8%,100%{transform:rotate(0)}}
@keyframes wire{0%{opacity:0}8%{opacity:1}86%,100%{opacity:0}}
@keyframes filev{0%{opacity:0}31%{opacity:1}84%,100%{opacity:0}}
@keyframes tuck{
0%,76.5%{transform:translateX(0) scaleX(1)}
84%,100%{transform:translateX(-17px) scaleX(.15)}}
@keyframes tug{0%{opacity:0}44.4%{opacity:1}45.6%{opacity:0}48.1%{opacity:1}49.4%,100%{opacity:0}}
@keyframes glint{0%{opacity:1}50%,100%{opacity:0}}
@keyframes lids{
