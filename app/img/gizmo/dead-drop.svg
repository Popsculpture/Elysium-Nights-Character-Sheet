15%,31%{transform:scale(1,.85)}
68%,72%{transform:scale(1,.1)}
77%,84%{transform:scale(1,.75)}
97%{transform:scale(1,.08)}}
@keyframes look{
0%,3%,95%,100%{transform:translate(0,0)}
