<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 96" width="288" height="384" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Dead Drop</title>
<desc id="desc">Gizmo crouches and throws a thin line of his own wire up over the top edge of the frame. He tests it, then lowers himself in three drops until he sinks out of view below the frame, leaving only the taut wire. The wire twangs twice. He hauls himself back up in two pulls with a glowing file wedged in his lower curve, shakes loose pixels off, checks both ways, tucks the file behind his body, and unhooks. Eight second loop on a transparent background.</desc>
<style>
.rappel{animation:rappel 8s ease-in-out infinite}
.pose{transform-origin:32px 78px;animation:pose 8s ease-in-out infinite}
.shk{transform-origin:32px 78px;animation:shk 8s steps(1,end) infinite}
.wire,.hook,.file,.tug,.bt{opacity:0}
.wire,.hook{animation:wire 8s steps(1,end) infinite}
.file{transform-origin:38px 57px;animation:tuck 8s ease-in-out infinite,filev 8s steps(1,end) infinite}
.tug{animation:tug 8s steps(1,end) infinite}
.glint{animation:glint .4s steps(1,end) infinite}
.bt0{transform:translate(46px,50px);animation:bt0 8s linear infinite,btv0 8s steps(1,end) infinite}@keyframes bt0{0%{transform:translate(46px,50px)}68%{transform:translate(46px,50px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}71.5%{transform:translate(54px,44px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}75%,100%{transform:translate(60px,62px)}}@keyframes btv0{0%{opacity:0}68%{opacity:1}75%,100%{opacity:0}}.bt1{transform:translate(18px,46px);animation:bt1 8s linear infinite,btv1 8s steps(1,end) infinite}@keyframes bt1{0%{transform:translate(18px,46px)}68.6%{transform:translate(18px,46px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}72.3%{transform:translate(10px,40px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}76%,100%{transform:translate(4px,58px)}}@keyframes btv1{0%{opacity:0}68.6%{opacity:1}76%,100%{opacity:0}}.bt2{transform:translate(46px,30px);animation:bt2 8s linear infinite,btv2 8s steps(1,end) infinite}@keyframes bt2{0%{transform:translate(46px,30px)}69.3%{transform:translate(46px,30px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}72.9%{transform:translate(55px,22px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}76.5%,100%{transform:translate(62px,40px)}}@keyframes btv2{0%{opacity:0}69.3%{opacity:1}76.5%,100%{opacity:0}}.bt3{transform:translate(18px,28px);animation:bt3 8s linear infinite,btv3 8s steps(1,end) infinite}@keyframes bt3{0%{transform:translate(18px,28px)}69.9%{transform:translate(18px,28px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}73.45%{transform:translate(9px,22px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}77%,100%{transform:translate(2px,38px)}}@keyframes btv3{0%{opacity:0}69.9%{opacity:1}77%,100%{opacity:0}}.bt4{transform:translate(40px,68px);animation:bt4 8s linear infinite,btv4 8s steps(1,end) infinite}@keyframes bt4{0%{transform:translate(40px,68px)}70.5%{transform:translate(40px,68px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}74.0%{transform:translate(50px,66px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}77.5%,100%{transform:translate(56px,80px)}}@keyframes btv4{0%{opacity:0}70.5%{opacity:1}77.5%,100%{opacity:0}}.bt5{transform:translate(20px,66px);animation:bt5 8s linear infinite,btv5 8s steps(1,end) infinite}@keyframes bt5{0%{transform:translate(20px,66px)}71.1%{transform:translate(20px,66px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}74.55%{transform:translate(12px,62px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}78%,100%{transform:translate(6px,78px)}}@keyframes btv5{0%{opacity:0}71.1%{opacity:1}78%,100%{opacity:0}}
.eyes{transform-origin:33px 41px;animation:lids 8s linear infinite}
.pupils{animation:look 8s ease-in-out infinite}
.brows{animation:brows 8s ease-in-out infinite}
@keyframes rappel{
0%,8%,12.5%{transform:translate(0,0)}
9.5%{transform:translate(0,-2px)}
11%{transform:translate(0,1.5px)}
14%{transform:translate(0,0)}
