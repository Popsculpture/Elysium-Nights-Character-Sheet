@keyframes look{0%,4%,87%,100%{transform:translate(0,0)}5.5%,7%{transform:translate(1.4px,-.3px)}8.5%,56%{transform:translate(1.4px,.2px)}57.5%,65.5%{transform:translate(-3px,1.2px)}67.5%,83%{transform:translate(1.4px,.3px)}}
