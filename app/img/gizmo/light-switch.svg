<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 92" width="560" height="368" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Light Switch</title>
<desc id="desc">A wall switch pops up beside Gizmo and the Gremlin scuttles in. The Gremlin hops up and flips it, and Gizmo's neon cuts out. He leans over and flips it back. They trade flips three times, faster each time, then both land on it at once and hold a staredown while the switch and his light stutter. Gizmo spots a second switch low on his other side, kicks it with his lower tip, and the Gremlin goes dark. It drops off the switch and slinks away. Eight second loop on a transparent background.</desc>
<style>
.gflick{animation:gflick 1.3s steps(1,end) infinite}.ge{transform-origin:33px 43px}@keyframes gflick{0%{opacity:1;transform:translateX(0)}90%{opacity:0}93.5%{opacity:1;transform:translateX(1px)}97%,100%{opacity:1;transform:translateX(0)}}

.gizmo{transform-origin:32px 78px;animation:pose 8s ease-in-out infinite}
.seg{animation:kick 8s ease-in-out infinite}
.neon,.nub-on{animation:neon 8s steps(1,end) infinite}
.nub-off{opacity:0;animation:noff 8s steps(1,end) infinite}
.sw1{transform-origin:91px 38px;transform:scale(0);animation:sw1 8s ease-out infinite}
.sw2{transform-origin:15px 69px;transform:scale(0);animation:sw2 8s ease-out infinite}
.n2-on{animation:n2on 8s steps(1,end) infinite}
.n2-off,.gdark,.spark{opacity:0;animation:8s steps(1,end) infinite}
.n2-off{animation-name:n2off}.gdark{animation-name:gdark}.spark{animation-name:spark}
.gpos{transform:translate(134px,36px);animation:gpos 8s ease-in-out infinite}
.gown{transform-origin:20px 48px;animation:gown 8s ease-in-out infinite}
.gcack{transform-origin:20px 48px;animation:gcack 8s steps(1,end) infinite}
.ge{animation:ge 8s steps(1,end) infinite}
.gp{animation:gp 8s steps(1,end) infinite}
.eyes{transform-origin:33px 41px;animation:lids 8s linear infinite}
.pupils{animation:look 8s ease-in-out infinite}
.brows{animation:brows 8s ease-in-out infinite}
