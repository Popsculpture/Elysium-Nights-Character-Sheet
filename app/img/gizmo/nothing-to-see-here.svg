<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="600" height="420" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Nothing to See Here</title>
<desc id="desc">Gizmo checks both ways and pops open three suspicious terminals, hunching over them with narrowed eyes. A pointer slides in and he jumps. He slams the three windows shut one after another and snaps upright with wide, innocent eyes fixed on the ceiling. The pointer pokes him and he sneaks a glance at it. One window creeps back open; he glares at it and it shuts. The pointer leaves and he sags with relief. Six second loop on a transparent background.</desc>
<style>
.window{opacity:0;transform-box:fill-box;transform-origin:center;animation:6s linear infinite}
.a{animation-name:winA,visA}.b{animation-name:winB,visB}.c{animation-name:winC,visC}
.a,.b,.c{animation-timing-function:linear,steps(1,end)}
.gizmo{transform-origin:99px 105px;animation:pose 6s ease-in-out infinite}
.eyes{transform-origin:33px 41px;animation:lids 6s linear infinite}
.pupils{animation:look 6s ease-in-out infinite}
.brows{animation:brows 6s ease-in-out infinite}
.cursor{transform:translate(72px,-30px);animation:cursor 6s ease-in-out infinite}
.panic{opacity:0;animation:panic 6s steps(1,end) infinite}
.code{animation:type .4s steps(1,end) infinite}
@keyframes winA{0%,9%{transform:scale(.6)}10.2%{transform:scale(1.08)}11.4%,41.5%{transform:scale(1)}42.3%{transform:scale(1.06)}43%,100%{transform:scale(0)}}
@keyframes visA{0%{opacity:0}9%{opacity:1}43%,100%{opacity:0}}
@keyframes winB{0%,13%{transform:scale(.6)}14.2%{transform:scale(1.08)}15.4%,44%{transform:scale(1)}44.8%{transform:scale(1.06)}45.5%,100%{transform:scale(0)}}
@keyframes visB{0%{opacity:0}13%{opacity:1}45.5%,100%{opacity:0}}
@keyframes winC{0%,17%{transform:scale(.6)}18.2%{transform:scale(1.08)}19.4%,46.5%{transform:scale(1)}47.3%{transform:scale(1.06)}48%,66.5%{transform:scale(.2)}69%{transform:scale(1.04)}69.6%,70.6%{transform:scale(1)}71.4%,100%{transform:scale(0)}}
@keyframes visC{0%{opacity:0}17%{opacity:1}48%{opacity:0}66.5%{opacity:1}71.4%,100%{opacity:0}}
@keyframes pose{
0%,6%,93%,100%{transform:translateY(0) rotate(0) scale(1,1)}
10%,37%{transform:translateY(0) rotate(-4deg) scale(1,.97)}
40%{transform:translateY(-5px) rotate(4deg) scale(.97,1.05)}
41.7%{transform:translateY(0) rotate(-6deg) scale(1,1)}
44.2%{transform:translateY(0) rotate(6deg) scale(1,1)}
46.7%{transform:translateY(0) rotate(-3deg) scale(1,1)}
49.5%{transform:translateY(0) rotate(0) scale(.96,1.07)}
52%,59%{transform:translateY(0) rotate(0) scale(.97,1.04)}
60.5%{transform:translateY(0) rotate(-3deg) scale(.97,1.04)}
63%{transform:translateY(0) rotate(1deg) scale(.97,1.04)}
65%,69.5%{transform:translateY(0) rotate(0) scale(.97,1.04)}
71%{transform:translateY(0) rotate(-2deg) scale(1,1)}
74%,83%{transform:translateY(0) rotate(0) scale(.97,1.04)}
88.5%{transform:translateY(0) rotate(0) scale(1.03,.96)}}
@keyframes lids{
0%,8%,93%,95%,98%,100%{transform:scale(1,1)}
10%,39.9%{transform:scale(1,.7)}
40%,43%{transform:scale(1.3,1.3)}
47%{transform:scale(1.2,1.2)}
49.5%,63.5%{transform:scale(1.15,1.15)}
64.5%,67%{transform:scale(1,.85)}
68%{transform:scale(1.15,1.15)}
69.8%,71.5%{transform:scale(1,.6)}
73.5%,83%{transform:scale(1.15,1.15)}
88.5%{transform:scale(1,.6)}
96.5%{transform:scale(1,.08)}}
@keyframes look{
0%,3%,92.5%,100%{transform:translate(0,0)}
4.5%,6%{transform:translate(-3px,0)}
7.2%,9%{transform:translate(1.4px,0)}
10%,13%{transform:translate(-3px,-.8px)}
14%,17%{transform:translate(1.4px,-.4px)}
18%,22.5%{transform:translate(-2.6px,1.4px)}
24%,27%{transform:translate(-3px,-.8px)}
28%,31%{transform:translate(1.4px,-.4px)}
32%,35.5%{transform:translate(-2.6px,1.4px)}
37%,40.5%{transform:translate(1.4px,-.2px)}
41.7%{transform:translate(-3px,-.8px)}
44.2%{transform:translate(1.4px,-.4px)}
46.7%{transform:translate(-2.6px,1.4px)}
49.5%,63.5%{transform:translate(-2.4px,-2.4px)}
64.8%,67%{transform:translate(1.4px,.3px)}
68.2%{transform:translate(-2.4px,-2.4px)}
69.8%,71.6%{transform:translate(-2.6px,1.4px)}
73.5%,82.5%{transform:translate(-2.4px,-2.4px)}
84.5%,88.5%{transform:translate(1.4px,-.5px)}}
@keyframes brows{
0%,8%,93%,100%{transform:translateY(0)}
10%,39.9%{transform:translateY(1.4px)}
40%,47%{transform:translateY(-3px)}
49.5%,69%{transform:translateY(-2.6px)}
69.8%,71.6%{transform:translateY(1px)}
73.5%,83%{transform:translateY(-2.6px)}
88.5%{transform:translateY(.5px)}}
@keyframes cursor{
0%,33%,88%,100%{transform:translate(72px,-30px)}
40%,57.5%{transform:translate(0,0)}
59.5%{transform:translate(-21px,1px)}
62.5%,80%{transform:translate(-5px,0)}}
@keyframes panic{0%{opacity:0}40%{opacity:1}43%,100%{opacity:0}}
@keyframes type{0%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Terminals sit behind Gizmo. Solid colours only: no stroke or fill opacity. -->
<g class="window a">
<rect x="12" y="16" width="80" height="44" rx="3" fill="#0c1822" stroke="#2ee6a0" stroke-width="1"/>
<path d="M12 26H92" stroke="#17705a"/>
<text x="17" y="23" fill="#2ee6a0" font-family="monospace" font-size="4.5">OFF_THE_BOOKS.exe</text>
<path d="m84 19 4 4m0-4-4 4" stroke="#ff6f9f"/>
<path d="M18 33h35m-35 6h54m-54 6h26m-26 6h44" stroke="#1f9e77" stroke-width="1.3"/>
<rect class="code" x="65" y="49" width="3" height="4" fill="#2ee6a0"/>
</g>
<g class="window b">
<rect x="111" y="24" width="77" height="47" rx="3" fill="#171325" stroke="#b893ff"/>
<path d="M111 34H188" stroke="#5b4a8a"/>
<text x="116" y="31" fill="#c4a4ff" font-family="monospace" font-size="4.5">CORP_SECRETS.zip</text>
<path d="m180 27 4 4m0-4-4 4" stroke="#ff6f9f"/>
<path d="M117 41h39m-39 6h60m-60 6h32m-32 6h49" stroke="#7f66c0" stroke-width="1.3"/>
<rect class="code" x="169" y="57" width="3" height="4" fill="#b893ff"/>
</g>
<g class="window c">
<rect x="24" y="65" width="71" height="38" rx="3" fill="#221524" stroke="#ff6f9f"/>
<path d="M24 75H95" stroke="#8a3d59"/>
<text x="29" y="72" fill="#ff8caf" font-family="monospace" font-size="4.5">DELETE_LOGS?</text>
<path d="m87 68 4 4m0-4-4 4" stroke="#ff6f9f"/>
<path d="M30 82h35m-35 6h53m-53 6h24" stroke="#b04e73" stroke-width="1.3"/>
<rect class="code" x="57" y="92" width="3" height="4" fill="#ff6f9f"/>
</g>
<g class="gizmo"><g transform="translate(67 27)">
<path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/>
<g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g>
</g></g>
<g class="panic" fill="none" stroke="#ffcc66" stroke-linecap="round"><path d="m116 42 4-5m0 12 6-1m-44-9-3-5" stroke-width="2"/></g>
<g class="cursor"><path d="M138 63v17l4-4 4 8 4-2-4-8h6z" fill="#e9f1fb" stroke="#07090d" stroke-width="1.3" stroke-linejoin="round"/></g>
</svg>
