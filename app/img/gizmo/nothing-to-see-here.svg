.nts-note1{animation-name:nts-drift1,nts-on1}.nts-note2{animation-name:nts-drift2,nts-on2}
.nts-bar{transform-box:fill-box;transform-origin:left center;animation:nts-bar 7.2s linear infinite}
.nts-code{animation:nts-type .4s steps(1,end) infinite}
