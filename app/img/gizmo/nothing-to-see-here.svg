<svg xmlns="http://www.w3.org/2000/svg" class="nts" viewBox="0 0 200 140" width="600" height="420" role="img" aria-labelledby="nts-title nts-desc">
<title id="nts-title">Gizmo: Nothing to See Here</title>
<desc id="nts-desc">Gizmo checks both ways and pops open three suspicious terminals, hunching over them with narrowed eyes. He freezes: he has been seen. Eyes wide, he lunges at each window and slams it shut, his eyes darting to each one in turn. Two new windows pop up as the last one closes, and one of them will not stay shut. His eyes flick between them in a panic. He stops, glares, hops, and lands hard. Everything closes at once. He snaps upright and whistles at the ceiling, sneaks one look at you, looks away, and sags with relief. Seven second loop on a transparent background.</desc>
