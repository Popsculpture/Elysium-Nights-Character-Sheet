.nts-window{opacity:0;transform-box:fill-box;transform-origin:center;animation:7.2s linear infinite}
.nts-a{animation-name:nts-winA,nts-visA}.nts-b{animation-name:nts-winB,nts-visB}.nts-c{animation-name:nts-winC,nts-visC}.nts-d{animation-name:nts-winD,nts-visD}.nts-e{animation-name:nts-winE,nts-visE}
.nts-a,.nts-b,.nts-c,.nts-d,.nts-e{animation-timing-function:linear,steps(1,end)}
.nts-gizmo{transform-origin:99px 105px;animation:nts-pose 7.2s ease-in-out infinite}
.nts-eyes{transform-origin:33px 41px;animation:nts-lids 7.2s linear infinite}
.nts-follow{transform:translate(calc(var(--gizmo-look-x,0)*1px),calc(var(--gizmo-look-y,0)*1px));transition:transform .12s linear}
