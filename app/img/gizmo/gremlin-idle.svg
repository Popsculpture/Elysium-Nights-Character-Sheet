<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 104" width="432" height="416" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Gremlin Idle</title>
<desc id="desc">Gizmo in Gremlin form: rust, kinked, mismatched pale yellow eyes, one dim green tip. He stands flickering. His head tics. His eyes dart left, down, right, up in hard steps. The dim tip blinks green twice. He glares up at it, clamps down and shudders until it stays dark, then gives a short scratchy cackle and blinks. Six second loop on a transparent background.</desc>
<style>
.pose,.shake{transform-origin:32px 78px}.lids{transform-origin:33px 41px}.eL{transform-origin:27px 41px}.eR{transform-origin:39px 41px}.pL{transform-origin:28px 41.5px}.pR{transform-origin:40px 41.5px}
.under{stroke:#e2622b}.over{display:none}.tip{stroke:#1c5744}.bL0,.bR0{display:none}.fL,.fR{fill:#ffe9a8}.eL{transform:translate(0,1.5px) scale(.72)}.eR{transform:translate(.5px,-1px) scale(1.26)}.pL,.pR{transform:scale(.75)}
.gfl{animation:gfl 6s steps(1,end) infinite}
@keyframes gfl{0%{opacity:1}15.5%{opacity:0}16.33%{opacity:1}40.5%{opacity:0}41.33%{opacity:1}65.5%{opacity:0}66.33%{opacity:1}90.5%{opacity:0}91.33%{opacity:1}100%{opacity:1}}
.pose{animation:pose 6s ease-in-out infinite}.shake{animation:shake 6s steps(1,end) infinite}.look{animation:look 6s steps(1,end) infinite}.lids{animation:lids 6s steps(1,end) infinite}.brows{animation:brows 6s steps(1,end) infinite}
.tip{animation:tip 6s steps(1,end) infinite}
@keyframes tip{0%{stroke:#1c5744}55%{stroke:#2ee6a0}56.7%{stroke:#1c5744}58.3%{stroke:#2ee6a0}60%{stroke:#1c5744}100%{stroke:#1c5744}}
@keyframes pose{0%,14%{transform:rotate(0deg) scale(1,1);animation-timing-function:steps(1,end)}15%{transform:rotate(5deg) scale(1,1);animation-timing-function:steps(1,end)}16.7%,55%{transform:rotate(0deg) scale(1,1);animation-timing-function:steps(1,end)}55.8%,59%{transform:rotate(0deg) scale(0.96,1.06)}60.5%,66%{transform:rotate(0deg) scale(1.08,0.88)}68%,100%{transform:rotate(0deg) scale(1,1)}}
@keyframes shake{0%{transform:rotate(0)}60.833%{transform:rotate(5deg)}61.667%{transform:rotate(-5deg)}62.500%{transform:rotate(5deg)}63.333%{transform:rotate(-5deg)}64.167%{transform:rotate(5deg)}65.000%{transform:rotate(-5deg)}65.833%{transform:rotate(5deg)}66.667%{transform:rotate(0)}72.500%{transform:rotate(5deg)}73.333%{transform:rotate(-5deg)}74.167%{transform:rotate(5deg)}75.000%{transform:rotate(-5deg)}75.833%{transform:rotate(5deg)}76.667%{transform:rotate(-5deg)}77.500%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes look{0%{transform:translate(0px,0.3px)}20%{transform:translate(-2.6px,0.3px)}27.5%{transform:translate(-2.6px,1.6px)}34%{transform:translate(1.4px,0.3px)}41%{transform:translate(1.4px,-1.4px)}47.5%{transform:translate(0px,0.3px)}55.8%{transform:translate(-0.6px,-2.2px)}60.5%{transform:translate(0px,0.3px)}100%{transform:translate(0px,0.3px)}}
@keyframes lids{0%{transform:scale(1,1)}15%{transform:scale(1,0.7)}16.7%{transform:scale(1,1)}55.8%{transform:scale(1.2,1.2)}60.5%{transform:scale(1,0.4)}67.5%{transform:scale(1,1)}72.5%{transform:scale(1,0.4)}78%{transform:scale(1,1)}88.3%{transform:scale(1,.08)}89.5%{transform:scale(1,1)}100%{transform:scale(1,1)}}
@keyframes brows{0%{transform:translateY(1.2px)}55.8%{transform:translateY(-1.5px)}60.5%{transform:translateY(2px)}67.5%{transform:translateY(1.2px)}100%{transform:translateY(1.2px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(22 14)"><g class="pose"><g class="shake"><g class="gfl"><g class="s3"><path class="under" d="M19 76 V60 l-5 -7 l5 -7 V22 l4 -11 l10 -3 l8 6 l4 8 V34 l5 7 l-5 7 V62 l-4 8 l-7 -1 l-3 -7 V40" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/><path class="over" d="M19 76 V60 l-5 -7 l5 -7 V22 l4 -11 l10 -3 l8 6 l4 8 V34 l5 7 l-5 7 V62 l-4 8 l-7 -1 l-3 -7 V40" pathLength="100" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/><path class="tip" d="M31 40 V30" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/></g><g class="brows" fill="none" stroke-width="2.3" stroke-linecap="round"><path class="bL0" d="M22 33 l7 -3" stroke="#2ee6a0"/><path class="bR0" d="M44 30 l-7 3" stroke="#2ee6a0"/><path class="bL1" d="M18.5 34 l3.5 -3 l3 3 l3 -3.5" stroke="#e2622b" stroke-linejoin="miter"/><path class="bR1" d="M34.5 31 l3 -3 l3.5 3 l3 -3.5 l2.5 3" stroke="#e2622b" stroke-linejoin="miter"/></g><g class="lids"><g class="eL"><circle class="fL" cx="27" cy="41" r="4.6"/><g class="look"><g class="pL"><circle cx="28" cy="41.5" r="2" fill="#07090d"/></g></g></g><g class="eR"><circle class="fR" cx="39" cy="41" r="4.6"/><g class="look"><g class="pR"><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g></g></g></g></g></g></g>
</svg>
