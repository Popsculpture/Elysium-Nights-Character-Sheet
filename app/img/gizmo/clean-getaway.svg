<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="448" height="336" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Clean Getaway</title>
<desc id="desc">Gizmo snaps a look over his shoulder, faces forward, and tips his upper curve in a quick salute. His body breaks into horizontal scan lines that thin out in three hard steps, then each line turns into a solid green dash and shoots off to the right, a few at a time, until nothing is left. Plays once over three seconds and ends on an empty transparent frame.</desc>
<style>
.live{animation:live 3s steps(1,end) both}
.gizmo{transform-origin:56px 78px;animation:pose 3s ease-in-out both}
.top{transform-origin:32px 34px;animation:salute 3s ease-in-out both}
.eyes{transform-origin:33px 41px;animation:lids 3s linear both}
.pupils{animation:look 3s ease-in-out both}
.brows{animation:brows 3s ease-in-out both}
.scan-a,.scan-b,.row,.streak{opacity:0}
.scan-a{animation:scanA 3s steps(1,end) both}
.scan-b{animation:scanB 3s steps(1,end) both}
.row{animation:3s steps(1,end) both}
