<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 90" width="352" height="360" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Lockpick</title>
<desc id="desc">A small keyhole plate rises beside Gizmo. He swings his inner tip out straight as a pick, leans in with one eye shut, and works the lock. Two tumbler pips light, then the pick slips, both go dark, and he shoots the viewer an annoyed look. He goes back in and lights all three. The plate swings open and vanishes. He re-curls the tip, leans back smug, and a wisp of pixel smoke rises off it. Eight second loop on a transparent background.</desc>
<style>
.gizmo{transform-origin:40px 82px;animation:pose 8s ease-in-out infinite}
.pick{transform-origin:31px 62px;animation:pick 8s ease-in-out infinite}
.plate{transform-origin:75px 53px;transform:translateY(46px);animation:plate 8s ease-in-out infinite}
.p1,.p2,.p3,.tick,.slip,.w1,.w2,.w3{opacity:0;animation:8s steps(1,end) infinite}
.p1{animation-name:p1}.p2{animation-name:p2}.p3{animation-name:p3}.tick{animation-name:tick}.slip{animation-name:slip}
.w1{animation-name:w1}.w2{animation-name:w2}.w3{animation-name:w3}
.eye-l{transform-origin:27px 41px;animation:lidL 8s linear infinite}
.eye-r{transform-origin:39px 41px;animation:lidR 8s linear infinite}
.pupil{animation:look 8s ease-in-out infinite}
.brows{animation:brows 8s ease-in-out infinite}
@keyframes pose{
0%,14%,80%,84%,95%,100%{transform:rotate(0) scale(1,1)}
18%,52.5%{transform:rotate(5deg) scale(1,.98)}
53.5%{transform:rotate(3deg) scale(1,1)}
57%,76%{transform:rotate(5deg) scale(1,.98)}
87%,92%{transform:rotate(-3deg) scale(1,1)}}
@keyframes pick{
0%,14%,88%,100%{transform:rotate(0)}
20%{transform:rotate(76deg)}
22%{transform:rotate(68deg)}
24%,30%,34%,38%,40%,44%,48%,52.5%{transform:rotate(70deg)}
32%,36%,42%,46%{transform:rotate(73deg)}
50%{transform:rotate(72deg)}
53.5%,56%{transform:rotate(57deg)}
59%,64%,69%,74%,78%{transform:rotate(70deg)}
62%,72%{transform:rotate(71deg)}
67%{transform:rotate(71.5deg)}
84%{transform:rotate(-5deg)}
86%{transform:rotate(2deg)}}
@keyframes plate{
0%,4%{transform:translateY(46px) scaleX(1)}
8%,75%{transform:translateY(0) scaleX(1)}
78%{transform:translateY(0) scaleX(0)}
78.1%,100%{transform:translateY(46px) scaleX(0)}}
@keyframes p1{0%{opacity:0}38%{opacity:1}53%{opacity:0}64%{opacity:1}78%,100%{opacity:0}}
@keyframes p2{0%{opacity:0}48%{opacity:1}53%{opacity:0}69%{opacity:1}78%,100%{opacity:0}}
@keyframes p3{0%{opacity:0}74%{opacity:1}78%,100%{opacity:0}}
@keyframes tick{0%{opacity:0}38%{opacity:1}39.5%{opacity:0}48%{opacity:1}49.5%{opacity:0}64%{opacity:1}65.5%{opacity:0}69%{opacity:1}70.5%{opacity:0}74%{opacity:1}75.5%,100%{opacity:0}}
@keyframes slip{0%{opacity:0}53%{opacity:1}55.5%,100%{opacity:0}}
@keyframes w1{0%{opacity:0}86%{opacity:1}88.5%,100%{opacity:0}}
@keyframes w2{0%{opacity:0}88.5%{opacity:1}91%,100%{opacity:0}}
@keyframes w3{0%{opacity:0}91%{opacity:1}93.5%,100%{opacity:0}}
@keyframes lidL{
0%,24%,80%,95%,96%,98.5%,100%{transform:scale(1,1)}
26.5%,52.9%{transform:scale(1,.1)}
53%,55.5%{transform:scale(1.2,1.2)}
58%,74.5%{transform:scale(1,.1)}
75.5%{transform:scale(1.15,1.15)}
86%,92%{transform:scale(1,.6)}
97.2%{transform:scale(1,.08)}}
@keyframes lidR{
0%,24%,80%,95%,96%,98.5%,100%{transform:scale(1,1)}
26.5%,52.9%{transform:scale(1,.8)}
53%,55.5%{transform:scale(1.2,1.2)}
58%,74.5%{transform:scale(1,.8)}
75.5%{transform:scale(1.15,1.15)}
86%,92%{transform:scale(1,.6)}
97.2%{transform:scale(1,.08)}}
@keyframes look{
0%,5%,95%,100%{transform:translate(0,0)}
7%,12%{transform:translate(1.3px,.5px)}
15%,52.5%{transform:translate(1.2px,.8px)}
53.5%,56%{transform:translate(-1px,-.3px)}
58%,77%{transform:translate(1.2px,.8px)}
80%,84.5%{transform:translate(-.8px,-2.2px)}
87%,92%{transform:translate(-1px,-.3px)}}
@keyframes brows{
0%,5%,80%,95%,100%{transform:translateY(0)}
15%,52.5%{transform:translateY(1.2px)}
53.5%,56%{transform:translateY(2.1px)}
58%,74.5%{transform:translateY(1.2px)}
75.5%{transform:translateY(-2.5px)}
87%,92%{transform:translateY(-1.3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Keyhole plate with three tumbler pips. -->
<g transform="translate(8 4)"><g class="plate">
<rect x="60" y="42" width="15" height="22" fill="#6b7c93" stroke="#07090d" stroke-width=".6"/>
<circle cx="66.5" cy="53.2" r="2.3" fill="#07090d"/><rect x="65.5" y="53.5" width="2" height="5.5" fill="#07090d"/>
<g fill="#07090d"><rect x="62" y="44.5" width="2.6" height="2.6"/><rect x="66.2" y="44.5" width="2.6" height="2.6"/><rect x="70.4" y="44.5" width="2.6" height="2.6"/></g>
<g fill="#a6ff4d"><rect class="p1" x="62" y="44.5" width="2.6" height="2.6"/><rect class="p2" x="66.2" y="44.5" width="2.6" height="2.6"/><rect class="p3" x="70.4" y="44.5" width="2.6" height="2.6"/></g>
</g></g>
<g class="gizmo"><g transform="translate(8 4)">
<!-- Body stops at the bottom of the lower curve; the inner arm is its own piece and swings from that joint. -->
<path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<path class="pick" d="M31 62 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round"/>
<g class="eye-l"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle class="pupil" cx="28" cy="41.5" r="2" fill="#07090d"/></g>
<g class="eye-r"><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/><circle class="pupil" cx="40" cy="41.5" r="2" fill="#07090d"/></g>
</g></g>
<g transform="translate(8 4)">
<rect class="tick" x="61" y="49" width="1.5" height="1.5" fill="#ffcc66"/>
<g class="slip" fill="#ffcc66"><rect x="58" y="47" width="2" height="2"/><rect x="56" y="54" width="2" height="2"/><rect x="60" y="59" width="1.5" height="1.5"/></g>
<rect class="w1" x="30" y="24" width="2" height="2" fill="#e9f1fb"/>
<g class="w2"><rect x="29" y="20" width="2" height="2" fill="#e9f1fb"/><rect x="32" y="22.5" width="1.5" height="1.5" fill="#6b7c93"/></g>
<g class="w3"><rect x="30.5" y="15" width="1.5" height="1.5" fill="#e9f1fb"/><rect x="28" y="18" width="1.5" height="1.5" fill="#6b7c93"/></g>
</g>
</svg>
