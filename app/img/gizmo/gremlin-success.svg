<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104" width="480" height="416" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Close Enough</title>
<desc id="desc">Gremlin Gizmo, job done. A small yellow check mark panel pops up beside him. He eyes it, winds back, and headbutts it. It swings crooked and hangs there. He cackles. The panel gives up and drops out of the frame while he watches it go. He blinks. Four second loop on a transparent background.</desc>
<style>
.pose,.shake{transform-origin:32px 78px}.lids{transform-origin:33px 41px}.eL{transform-origin:27px 41px}.eR{transform-origin:39px 41px}.pL{transform-origin:28px 41.5px}.pR{transform-origin:40px 41.5px}
.under{stroke:#e2622b}.over{display:none}.tip{stroke:#1c5744}.bL0,.bR0{display:none}.fL,.fR{fill:#ffe9a8}.eL{transform:translate(0,1.5px) scale(.72)}.eR{transform:translate(.5px,-1px) scale(1.26)}.pL,.pR{transform:scale(.75)}
.gfl{animation:gfl 4s steps(1,end) infinite}
@keyframes gfl{0%{opacity:1}20.67%{opacity:0}21.92%{opacity:1}54.0%{opacity:0}55.25%{opacity:1}87.33%{opacity:0}88.58%{opacity:1}100%{opacity:1}}
.pose{animation:pose 4s ease-in-out infinite}.shake{animation:shake 4s steps(1,end) infinite}.look{animation:look 4s steps(1,end) infinite}.lids{animation:lids 4s steps(1,end) infinite}.brows{animation:brows 4s steps(1,end) infinite}
.pan{transform-origin:61px 34px;animation:pan 4s linear infinite,panv 4s steps(1,end) infinite}.sp{opacity:0;animation:sp 4s steps(1,end) infinite}
@keyframes pose{0%,20%{transform:rotate(0deg) scale(1,1)}27.5%{transform:rotate(-9deg) scale(1,1);animation-timing-function:steps(1,end)}30%{transform:rotate(16deg) scale(1,1);animation-timing-function:steps(1,end)}32.5%{transform:rotate(16deg) scale(1,1);animation-timing-function:cubic-bezier(.2,.8,.3,1)}38.75%,100%{transform:rotate(0deg) scale(1,1)}}
@keyframes shake{0%{transform:rotate(0)}45.000%{transform:rotate(6deg)}46.250%{transform:rotate(-6deg)}47.500%{transform:rotate(6deg)}48.750%{transform:rotate(-6deg)}50.000%{transform:rotate(6deg)}51.250%{transform:rotate(-6deg)}52.500%{transform:rotate(6deg)}53.750%{transform:rotate(-6deg)}55.000%{transform:rotate(6deg)}56.250%{transform:rotate(-6deg)}57.500%{transform:rotate(6deg)}58.750%{transform:rotate(-6deg)}60.000%{transform:rotate(6deg)}61.250%{transform:rotate(-6deg)}62.500%{transform:rotate(6deg)}63.750%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes pan{0%,10%{transform:translate(0px,0px) rotate(0deg) scale(0.1);animation-timing-function:cubic-bezier(.2,.8,.3,1.4)}13.75%,30%{transform:translate(0px,0px) rotate(0deg) scale(1);animation-timing-function:steps(1,end)}30.01%{transform:translate(3px,2px) rotate(30deg) scale(1);animation-timing-function:cubic-bezier(.2,.8,.3,1)}33.75%{transform:translate(3px,3px) rotate(20deg) scale(1)}36%{transform:translate(3px,3px) rotate(25deg) scale(1)}38%,70%{transform:translate(3px,3px) rotate(22deg) scale(1);animation-timing-function:cubic-bezier(.6,0,.9,.5)}82.5%,100%{transform:translate(8px,80px) rotate(100deg) scale(1)}}
@keyframes panv{0%{opacity:0}10%{opacity:1}82.5%{opacity:0}100%{opacity:0}}
@keyframes sp{0%{opacity:0}30%{opacity:1}32.5%{opacity:0}100%{opacity:0}}
@keyframes look{0%{transform:translate(0px,0.3px)}12.5%{transform:translate(1.4px,-1.6px)}30%{transform:translate(1.4px,-0.6px)}45%{transform:translate(0px,0.3px)}66.25%{transform:translate(1.4px,-0.6px)}72.5%{transform:translate(1.4px,0.8px)}76.25%{transform:translate(1.4px,1.9px)}86.25%{transform:translate(0px,0.3px)}100%{transform:translate(0px,0.3px)}}
@keyframes lids{0%{transform:scale(1,1)}12.5%{transform:scale(1.15,1.15)}20%{transform:scale(1,0.6)}30%{transform:scale(1,1)}45%{transform:scale(1,0.4)}63.75%{transform:scale(1,1)}91.25%{transform:scale(1,.08)}92.45%{transform:scale(1,1)}100%{transform:scale(1,1)}}
@keyframes brows{0%{transform:translateY(1.2px)}12.5%{transform:translateY(-1px)}20%{transform:translateY(2.2px)}30%{transform:translateY(1.2px)}100%{transform:translateY(1.2px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(22 14)"><g class="pose"><g class="shake"><g class="gfl"><g class="s3"><path class="under" d="M19 76 V60 l-5 -7 l5 -7 V22 l4 -11 l10 -3 l8 6 l4 8 V34 l5 7 l-5 7 V62 l-4 8 l-7 -1 l-3 -7 V40" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/><path class="over" d="M19 76 V60 l-5 -7 l5 -7 V22 l4 -11 l10 -3 l8 6 l4 8 V34 l5 7 l-5 7 V62 l-4 8 l-7 -1 l-3 -7 V40" pathLength="100" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/><path class="tip" d="M31 40 V30" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/></g><g class="brows" fill="none" stroke-width="2.3" stroke-linecap="round"><path class="bL0" d="M22 33 l7 -3" stroke="#2ee6a0"/><path class="bR0" d="M44 30 l-7 3" stroke="#2ee6a0"/><path class="bL1" d="M18.5 34 l3.5 -3 l3 3 l3 -3.5" stroke="#e2622b" stroke-linejoin="miter"/><path class="bR1" d="M34.5 31 l3 -3 l3.5 3 l3 -3.5 l2.5 3" stroke="#e2622b" stroke-linejoin="miter"/></g><g class="lids"><g class="eL"><circle class="fL" cx="27" cy="41" r="4.6"/><g class="look"><g class="pL"><circle cx="28" cy="41.5" r="2" fill="#07090d"/></g></g></g><g class="eR"><circle class="fR" cx="39" cy="41" r="4.6"/><g class="look"><g class="pR"><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g></g></g></g></g></g><g class="pan"><rect x="62" y="12" width="20" height="16" rx="2" fill="#07090d" stroke="#ffcc66" stroke-width="1.6"/><path d="M67 20 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffcc66" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/></g><g class="sp" stroke="#e9f1fb" stroke-width="1.6" stroke-linecap="square"><path d="M58 22 l-3 -4 M60 19 v-5 M56 27 h-4"/></g></g>
</svg>
