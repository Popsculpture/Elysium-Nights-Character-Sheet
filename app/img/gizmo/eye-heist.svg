<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 96" width="560" height="384" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Eye Heist</title>
<desc id="desc">The Gremlin drops in from above, hops at Gizmo's face, plucks out his right eye, and backs off cackling. Gizmo gropes around with the eye he has left. The Gremlin wears the stolen eye as a monocle, then juggles it. Gizmo lunges and misses, lunges again and snatches it out of the air. He jams it in on the wrong side, blinks, and hops it over to the right socket. He glares with both eyes until the Gremlin leaves, then checks each eye with a blink. Nine second loop on a transparent background.</desc>
<style>
.gflick{animation:gflick 1.3s steps(1,end) infinite}.ge{transform-origin:33px 43px}@keyframes gflick{0%{opacity:1;transform:translateX(0)}90%{opacity:0}93.5%{opacity:1;transform:translateX(1px)}97%,100%{opacity:1;transform:translateX(0)}}

.gslide{animation:gslide 9s ease-in-out infinite}
.gizmo{transform-origin:32px 78px;animation:pose 9s ease-in-out infinite}
.eye-l{transform-origin:27px 41px;animation:lidL 9s linear infinite}
.eye-r{transform-origin:39px 41px;animation:lidR 9s linear infinite,eyeRv 9s steps(1,end) infinite}
.wrong{opacity:0;transform-origin:39px 41px;animation:wrong 9s ease-in-out infinite,wrongv 9s steps(1,end) infinite}
.pupil{animation:look 9s ease-in-out infinite}
.wp{animation:wp 9s ease-in-out infinite}
.brows{animation:brows 9s ease-in-out infinite}
.gpos{transform:translate(70px,-70px);animation:gpos 9s ease-in-out infinite}
.gown{transform-origin:20px 48px;animation:gown 9s ease-in-out infinite}
.gcack{transform-origin:20px 48px;animation:gcack 9s steps(1,end) infinite}
.ge{animation:ge 9s steps(1,end) infinite}
.gp{animation:gp 9s steps(1,end) infinite}
.loose{opacity:0;animation:loose 9s ease-in-out infinite,loosev 9s steps(1,end) infinite}
.lp{animation:lp 9s steps(1,end) infinite}
@keyframes gslide{0%,44.5%,51.5%,54%,63.5%,100%{transform:translateX(0px)}46%{transform:translateX(-4px);animation-timing-function:cubic-bezier(.5,0,.3,1)}48%{transform:translateX(16px)}56%{transform:translateX(-5px);animation-timing-function:cubic-bezier(.5,0,.3,1)}58.5%,59.5%{transform:translateX(34px)}}
@keyframes pose{0%,17.5%,30%,44.5%,51.5%,54%,63.5%,100%{transform:rotate(0) scale(1,1)}19.5%{transform:rotate(-5deg) scale(1,1)}22.5%{transform:rotate(5deg) scale(1,1)}25.5%{transform:rotate(-4deg) scale(1,1)}28%{transform:rotate(3deg) scale(1,1)}46%{transform:rotate(-4deg) scale(1,1)}48%{transform:rotate(12deg) scale(1,1)}56%{transform:rotate(-5deg) scale(1,1)}58.5%,59.5%{transform:rotate(18deg) scale(1,1.03)}62%{transform:rotate(0) scale(1.04,.95)}}
@keyframes lidL{0%,11.9%,62%,65.2%,67%,84%,87.2%,89%,100%{transform:scale(1,1)}12%,14%{transform:scale(1.3,1.3)}18%,29%{transform:scale(1.15,1.15)}31%,58%{transform:scale(1,.6)}59%,60.5%{transform:scale(1.1,1.1)}66.1%,88.1%{transform:scale(1,.08)}72.5%,80%{transform:scale(1,.55)}}
@keyframes lidR{0%,12%,72%,84%,90.2%,92%,100%{transform:scale(1,1)}72.5%,80%{transform:scale(1,.55)}91.1%{transform:scale(1,.08)}}
@keyframes eyeRv{0%{opacity:1}12%{opacity:0}72%,100%{opacity:1}}
@keyframes wrong{0%,61.9%{transform:translate(-24px,0) scale(0,0)}63%{transform:translate(-24px,0) scale(1.3,1.3)}64%,65.2%{transform:translate(-24px,0) scale(1,1)}66.1%{transform:translate(-24px,0) scale(1,.08)}67%,68.5%{transform:translate(-24px,0) scale(1,1)}70%{transform:translate(-12px,-9px) scale(1,1)}71.5%,100%{transform:translate(0,0) scale(1,1)}}
@keyframes wrongv{0%{opacity:0}62%{opacity:1}72%{opacity:0}100%{opacity:0}}
@keyframes wp{0%,68%{transform:translate(1.4px,0)}71%,100%{transform:translate(0,0)}}
@keyframes look{0%,5%,89%,100%{transform:translate(0,0)}6.5%,9%{transform:translate(.8px,-2.2px)}10%,17%{transform:translate(1.4px,.2px)}19.5%{transform:translate(-3px,.5px)}22.5%{transform:translate(1.4px,.5px)}25.5%{transform:translate(-3px,1px)}28%{transform:translate(1.2px,1.2px)}30.5%,58%{transform:translate(1.4px,.2px)}59%,61%{transform:translate(1.2px,-1.5px)}62.5%,68%{transform:translate(-3.2px,0)}71%,80%{transform:translate(1.4px,.2px)}82%,85.5%{transform:translate(.8px,-2.2px)}}
@keyframes brows{0%,11.9%,85%,100%{transform:translateY(0)}12%,14%{transform:translateY(-3px)}18%,29%{transform:translateY(-1.5px)}31%,58%{transform:translateY(2px)}62.5%,68%{transform:translateY(-1px)}72.5%,80%{transform:translateY(2.2px)}}
@keyframes gpos{0%,5%{transform:translate(70px,-70px);animation-timing-function:cubic-bezier(.5,0,1,.7)}9%,10%{transform:translate(70px,40px)}12%{transform:translate(46px,22px)}15%{transform:translate(78px,40px)}18%,46%{transform:translate(90px,40px)}47.8%{transform:translate(98px,36px)}50%,56.5%{transform:translate(90px,40px)}58.5%{transform:translate(96px,40px)}60.5%{transform:translate(96px,33px)}62%,78%{transform:translate(96px,40px);animation-timing-function:cubic-bezier(.5,0,.8,.5)}84%,100%{transform:translate(98px,-80px)}}
@keyframes gown{0%,8.9%,10.5%,30%,41%,59%,61.5%,100%{transform:rotate(0) scale(1,1)}9.5%{transform:rotate(0) scale(1.15,.8)}32%,39.5%{transform:rotate(-8deg) scale(1,1)}60%{transform:rotate(0) scale(.9,1.15)}}
@keyframes gcack{0%{transform:rotate(0)}15.000%{transform:rotate(7deg)}15.556%{transform:rotate(-7deg)}16.111%{transform:rotate(7deg)}16.667%{transform:rotate(-7deg)}17.222%{transform:rotate(7deg)}17.778%{transform:rotate(-7deg)}18.333%{transform:rotate(0)}62.222%{transform:rotate(7deg)}62.778%{transform:rotate(-7deg)}63.333%{transform:rotate(7deg)}63.889%{transform:rotate(-7deg)}64.444%{transform:rotate(7deg)}65.000%{transform:rotate(-7deg)}65.556%{transform:rotate(7deg)}66.111%{transform:rotate(-7deg)}66.667%{transform:rotate(7deg)}67.222%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes ge{0%{transform:scale(1,1)}15%{transform:scale(1,.35)}18%{transform:scale(1,1)}32%{transform:scale(1,.5)}40%{transform:scale(1,1)}59.5%{transform:scale(1.3,1.3)}62%{transform:scale(1,.5)}67%{transform:scale(1,1)}100%{transform:scale(1,1)}}
@keyframes gp{0%{transform:translate(-1.6px,.5px)}40%{transform:translate(-.5px,-1.8px)}59.5%{transform:translate(-1.6px,.5px)}78%{transform:translate(-.5px,-1.8px)}100%{transform:translate(-1.6px,.5px)}}
@keyframes loose{0%,30%{transform:translate(14px,28px)}32%,39.5%{transform:translate(25px,27px)}40.5%{transform:translate(20px,2px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}43.5%{transform:translate(20px,-22px);animation-timing-function:cubic-bezier(.6,0,.9,.4)}47%{transform:translate(20px,2px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}50.5%{transform:translate(20px,-24px);animation-timing-function:cubic-bezier(.6,0,.9,.4)}54%{transform:translate(20px,2px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}57.2%{transform:translate(20px,-26px);animation-timing-function:cubic-bezier(.6,0,.9,.4)}59%,100%{transform:translate(20px,-14px)}}
@keyframes loosev{0%{opacity:0}12%{opacity:1}59%{opacity:0}100%{opacity:0}}
@keyframes lp{0%{transform:translate(0,0)}15%{transform:translate(-1.5px,.5px)}18%{transform:translate(1.5px,-1px)}21%{transform:translate(-2px,-.5px)}24%{transform:translate(.5px,1.6px)}27%{transform:translate(-2.4px,0)}31%{transform:translate(1.8px,0)}34%{transform:translate(-2.4px,.4px)}37%{transform:translate(0,-1.8px)}41%{transform:translate(0,1.6px)}44%{transform:translate(0,-1.8px)}47.5%{transform:translate(0,1.6px)}51%{transform:translate(0,-1.8px)}54.5%{transform:translate(0,1.6px)}100%{transform:translate(0,0)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(24 10)"><g class="gslide"><g class="gizmo">
<path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<g class="eye-l"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle class="pupil" cx="28" cy="41.5" r="2" fill="#07090d"/></g>
<g class="eye-r"><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/><circle class="pupil" cx="40" cy="41.5" r="2" fill="#07090d"/></g>
<!-- The recovered eye, first jammed in on the wrong side. -->
<g class="wrong"><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/><circle class="wp" cx="40" cy="41.5" r="2" fill="#07090d"/></g>
</g></g></g>
<g class="gpos"><g class="gown"><g class="gcack"><g class="gflick"><g transform="scale(.62)"><path d="M19 76 V52 l-5 -8 l5 -8 V22 a13 13 0 0 1 26 0 V38 l5 7 l-5 7 V62 a7 7 0 0 1 -14 0 V36" fill="none" stroke="#e2622b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/><path d="M19 31 l5 3 l4 -4 l5 4 l4 -4 l5 4 l4 -3" fill="none" stroke="#e2622b" stroke-width="2.4" stroke-linejoin="miter"/><g class="ge"><circle cx="26" cy="43" r="5.8" fill="#ffe9a8"/><circle cx="40.5" cy="44" r="3.3" fill="#ffe9a8"/><g class="gp"><circle cx="26.5" cy="43.5" r="2.1" fill="#07090d"/><circle cx="40.8" cy="44.3" r="1.5" fill="#07090d"/></g></g></g></g></g></g>
<!-- Stolen eye, carried by the Gremlin. -->
<g class="loose"><circle r="4.6" fill="#e9f1fb"/><circle class="lp" cx="1" cy=".5" r="2" fill="#07090d"/></g>
</g>
</svg>
