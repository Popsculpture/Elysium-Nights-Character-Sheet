<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 92" width="736" height="368" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Laser Limbo</title>
<desc id="desc">Three sets of red security beams switch on across the frame. Gizmo studies them, then squashes flat and slides under the first, tips onto his side and floats through the gap in the second pair, and pinches thin to slip between the last two. He straightens up on the far side and leans back, smug. His lower tip is still in the last beam. Every beam starts flashing, he looks down at his foot, and bolts out of frame. The beams cut out and he slides back in from the left to where he started. Eight second loop on a transparent background.</desc>
