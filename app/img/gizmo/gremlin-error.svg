<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 104" width="448" height="416" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Wasn't Me</title>
<desc id="desc">Gremlin Gizmo is mid-cackle when a red fault light pops on beside him and starts blinking. He freezes with his eyes wide. He looks at the light, looks left, looks right. Then he rolls his eyes up and away and sways on the spot while two rust-colored musical notes drift up, the worst innocent act in the city. He sneaks a glance at the light. It goes out. He lets out one more short cackle. Five second loop on a transparent background.</desc>
<style>
