.pose{animation:pose 5s ease-in-out infinite}.shake{animation:shake 5s steps(1,end) infinite}.look{animation:look 5s steps(1,end) infinite}.lids{animation:lids 5s steps(1,end) infinite}.brows{animation:brows 5s steps(1,end) infinite}
.lamp{opacity:0;animation:lamp 5s steps(1,end) infinite}.led{animation:led 5s steps(1,end) infinite}.n1{opacity:0;animation:n1 5s linear infinite,n1v 5s steps(1,end) infinite}.n2{opacity:0;animation:n2 5s linear infinite,n2v 5s steps(1,end) infinite}
@keyframes pose{0%,18%{transform:rotate(0deg) scale(0.98,1.04);animation-timing-function:steps(1,end)}19%{transform:rotate(0deg) scale(0.94,1.1)}22%,46%{transform:rotate(0deg) scale(1,1)}52%{transform:rotate(-3deg) scale(1,1)}60%{transform:rotate(3deg) scale(1,1)}68%{transform:rotate(-3deg) scale(1,1)}76%{transform:rotate(3deg) scale(1,1)}82%,100%{transform:rotate(0deg) scale(1,1)}}
@keyframes shake{0%{transform:rotate(0)}2.000%{transform:rotate(6deg)}3.000%{transform:rotate(-6deg)}4.000%{transform:rotate(6deg)}5.000%{transform:rotate(-6deg)}6.000%{transform:rotate(6deg)}7.000%{transform:rotate(-6deg)}8.000%{transform:rotate(6deg)}9.000%{transform:rotate(-6deg)}10.000%{transform:rotate(6deg)}11.000%{transform:rotate(-6deg)}12.000%{transform:rotate(6deg)}13.000%{transform:rotate(-6deg)}14.000%{transform:rotate(6deg)}15.000%{transform:rotate(-6deg)}16.000%{transform:rotate(6deg)}17.000%{transform:rotate(-6deg)}18.000%{transform:rotate(0)}91.000%{transform:rotate(6deg)}92.000%{transform:rotate(-6deg)}93.000%{transform:rotate(6deg)}94.000%{transform:rotate(-6deg)}95.000%{transform:rotate(6deg)}96.000%{transform:rotate(0)}100%{transform:rotate(0)}}
