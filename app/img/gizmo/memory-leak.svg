<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 92" width="288" height="368" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Memory Leak</title>
<desc id="desc">Three bright green pixel squares pop out of the top of Gizmo's head, leaving three holes, and tumble down his right side to the floor. He watches them fall and freezes, blushing. His lower tip curls out under the pixels and flings them back up, and they slot into the holes one by one. The repair spot bulges and settles, and he glances left and right for witnesses. Five second loop on a transparent background.</desc>
<style>
.gizmo{transform-origin:32px 78px;animation:pose 5s ease-in-out infinite}
.hole{opacity:0;animation:5s steps(1,end) infinite}
.h1{animation-name:vis1}.h2{animation-name:vis2}.h3{animation-name:vis3}
.px{opacity:0}
.p1{transform:translate(33.1px,9.1px);animation:leak1 5s ease-in-out infinite,vis1 5s steps(1,end) infinite}
.p2{transform:translate(35.8px,9.6px);animation:leak2 5s ease-in-out infinite,vis2 5s steps(1,end) infinite}
.p3{transform:translate(38.3px,10.6px);animation:leak3 5s ease-in-out infinite,vis3 5s steps(1,end) infinite}
.scoop{stroke-dasharray:100 300;stroke-dashoffset:103;transform-origin:19px 76px;animation:reach 5s linear infinite,lift 5s ease-in-out infinite}
.bulge{transform-origin:35.8px 9.6px;transform:scale(0);animation:bulge 5s ease-in-out infinite}
.blush{opacity:0;animation:blush 5s steps(1,end) infinite}
.eyes{transform-origin:33px 41px;animation:lids 5s linear infinite}
.pupils{animation:look 5s ease-in-out infinite}
.brows{animation:brows 5s ease-in-out infinite}
@keyframes pose{
0%,22%,37%,49%,55%,62%,70%,92%,100%{transform:rotate(0) scale(1,1)}
25%,34%{transform:rotate(0) scale(.98,1.04)}
52%{transform:rotate(0) scale(1.03,.96)}
64.5%{transform:rotate(0) scale(.98,1.03)}
67%{transform:rotate(0) scale(1.02,.98)}
75%,80%{transform:rotate(-1.5deg) scale(1,1)}
83%,88%{transform:rotate(1.5deg) scale(1,1)}}
@keyframes vis1{0%{opacity:0}6%{opacity:1}59%,100%{opacity:0}}
@keyframes vis2{0%{opacity:0}9.5%{opacity:1}60.5%,100%{opacity:0}}
@keyframes vis3{0%{opacity:0}13%{opacity:1}62%,100%{opacity:0}}
@keyframes leak1{
0%{transform:translate(33.1px,9.1px)}
6%{transform:translate(33.1px,9.1px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}
8%{transform:translate(41px,3px);animation-timing-function:linear}
9.5%{transform:translate(48.5px,10px);animation-timing-function:cubic-bezier(.5,0,1,.6)}
15%{transform:translate(49.5px,81.6px)}
16.5%{transform:translate(49.2px,79.6px)}
18%{transform:translate(49.5px,81.6px)}
47%{transform:translate(49.5px,81.6px);animation-timing-function:cubic-bezier(.5,0,.8,.6)}
52%{transform:translate(48.2px,65.6px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}
57%{transform:translate(46.5px,4.5px)}
59%,100%{transform:translate(33.1px,9.1px)}}
@keyframes leak2{
0%{transform:translate(35.8px,9.6px)}
9.5%{transform:translate(35.8px,9.6px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}
11.5%{transform:translate(44px,2.5px);animation-timing-function:linear}
13%{transform:translate(51.5px,10px);animation-timing-function:cubic-bezier(.5,0,1,.6)}
18.5%{transform:translate(52.5px,81.6px)}
20%{transform:translate(52.7px,80px)}
21.5%{transform:translate(52.5px,81.6px)}
47%{transform:translate(52.5px,81.6px);animation-timing-function:cubic-bezier(.5,0,.8,.6)}
52%{transform:translate(50.8px,64.1px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}
58.5%{transform:translate(48px,4px)}
60.5%,100%{transform:translate(35.8px,9.6px)}}
@keyframes leak3{
0%{transform:translate(38.3px,10.6px)}
13%{transform:translate(38.3px,10.6px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}
15%{transform:translate(47px,3px);animation-timing-function:linear}
16.5%{transform:translate(54.5px,11px);animation-timing-function:cubic-bezier(.5,0,1,.6)}
22%{transform:translate(55.5px,81.6px)}
23.5%{transform:translate(55.6px,80.2px)}
25%{transform:translate(55.5px,81.6px)}
47%{transform:translate(55.5px,81.6px);animation-timing-function:cubic-bezier(.5,0,.8,.6)}
52%{transform:translate(53.4px,62.6px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}
60%{transform:translate(49.5px,4.5px)}
62%,100%{transform:translate(38.3px,10.6px)}}
@keyframes reach{
0%{stroke-dashoffset:103}
35%{stroke-dashoffset:103;animation-timing-function:cubic-bezier(.2,.7,.3,1)}
45%{stroke-dashoffset:0}
58%{stroke-dashoffset:0;animation-timing-function:cubic-bezier(.6,0,.9,.5)}
66%,100%{stroke-dashoffset:103}}
@keyframes lift{
0%{transform:rotate(0)}
47%{transform:rotate(0);animation-timing-function:cubic-bezier(.5,0,.8,.6)}
52%,53.5%{transform:rotate(-30deg)}
58%,100%{transform:rotate(0)}}
@keyframes bulge{
0%,61.9%,73.1%,100%{transform:scale(0)}
62%{transform:scale(.5)}
64.5%{transform:scale(1.15)}
68%{transform:scale(.95)}
73%{transform:scale(.4)}}
@keyframes blush{0%{opacity:0}25%{opacity:1}70%,100%{opacity:0}}
@keyframes lids{
0%,6.5%,12%,56%,59%,68%,92%,93.5%,97.5%,100%{transform:scale(1,1)}
8.5%{transform:scale(1.12,1.12)}
25%,34%{transform:scale(1.18,1.18)}
37%,49%{transform:scale(1,.8)}
52%{transform:scale(1,.5)}
63%{transform:scale(1,.6)}
74%,88%{transform:scale(1,.8)}
95.5%{transform:scale(1,.08)}}
@keyframes look{
0%,6.5%,92%,100%{transform:translate(0,0)}
8.5%,10%{transform:translate(.9px,-2.3px)}
14%{transform:translate(1.4px,-.4px)}
20%,50%{transform:translate(.9px,1.3px)}
53%,56%{transform:translate(1.4px,-.5px)}
60%,66%{transform:translate(.9px,-2.3px)}
70%{transform:translate(-1px,-.3px)}
74%,80%{transform:translate(-3.3px,0)}
83%,88%{transform:translate(1.4px,0)}}
@keyframes brows{
0%,6.5%,56%,59%,70%,92%,100%{transform:translateY(0)}
8.5%{transform:translateY(-1.6px)}
14%{transform:translateY(-.5px)}
25%,34%{transform:translateY(-2.6px)}
37%,49%{transform:translateY(1px)}
52%{transform:translateY(2px)}
63%{transform:translateY(-1.5px)}
74%,88%{transform:translateY(.7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<!-- Three square holes open in the top of his head while the pixels are out. -->
<mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="92">
<rect width="72" height="92" fill="#fff"/>
<rect class="hole h1" x="32" y="8" width="2.2" height="2.2"/>
<rect class="hole h2" x="34.7" y="8.5" width="2.2" height="2.2"/>
<rect class="hole h3" x="37.2" y="9.5" width="2.2" height="2.2"/>
</mask>
</defs>
<!-- The lower tip stretches into a scoop: it draws on from the foot, flicks up from the foot joint, then retracts. -->
<path class="scoop" pathLength="100" d="M19 76 V79 a6 6 0 0 0 6 6 H55 a4.5 4.5 0 0 0 4.5 -4.5 V79" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="gizmo">
<circle class="bulge" cx="35.8" cy="9.6" r="4.4" fill="#2ee6a0"/>
<g mask="url(#holes)"><path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="blush" fill="#ff6f9f"><rect x="22.5" y="47" width="3.2" height="1.5"/><rect x="36.4" y="47" width="3.2" height="1.5"/></g>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/>
<g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g>
</g>
<g fill="#a6ff4d">
<g class="px p1"><rect x="-1.1" y="-1.1" width="2.2" height="2.2"/></g>
<g class="px p2"><rect x="-1.1" y="-1.1" width="2.2" height="2.2"/></g>
<g class="px p3"><rect x="-1.1" y="-1.1" width="2.2" height="2.2"/></g>
</g>
</svg>
