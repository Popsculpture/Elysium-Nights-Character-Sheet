<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 100" width="416" height="400" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Natural One</title>
<desc id="desc">Gizmo looks up. A small die drops out of the air, bonks him flat on the head, and tumbles off to land beside him showing a single red pip. He opens his eyes, looks down at it, then turns a flat, half-lidded stare on the viewer and blinks once, slowly. He glances at the die again and it blinks out. Four second loop on a transparent background.</desc>
<style>

.gizmo{transform-origin:32px 78px;animation:pose 4s ease-in-out infinite}
.eyes{transform-origin:33px 41px;animation:lids 4s steps(1,end) infinite}.pupils{animation:look 4s steps(1,end) infinite}.brows{animation:brows 4s steps(1,end) infinite}
.die{animation:die 4s linear infinite,diev 4s steps(1,end) infinite}.hit{opacity:0;animation:hit 4s steps(1,end) infinite}
@keyframes pose{0%,14.9%{transform:rotate(0deg) scale(1,1);animation-timing-function:steps(1,end)}15%{transform:rotate(0deg) scale(1.2,0.76);animation-timing-function:cubic-bezier(.2,.8,.3,1)}20%{transform:rotate(0deg) scale(0.94,1.08)}25%,42%{transform:rotate(0deg) scale(1,1)}48%,80%{transform:rotate(0deg) scale(1.04,0.94)}86%,100%{transform:rotate(0deg) scale(1,1)}}
@keyframes die{0%{transform:translate(32px,-34px) rotate(0deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}15%{transform:translate(32px,0.5px) rotate(0deg);animation-timing-function:cubic-bezier(.1,.6,.4,1)}22%{transform:translate(56px,-12px) rotate(120deg);animation-timing-function:cubic-bezier(.6,0,1,.6)}33.75%{transform:translate(66px,70px) rotate(290deg);animation-timing-function:cubic-bezier(.1,.6,.4,1)}37.5%{transform:translate(70px,63px) rotate(335deg);animation-timing-function:cubic-bezier(.6,0,1,.6)}41.25%,100%{transform:translate(72px,70px) rotate(360deg)}}
@keyframes diev{0%{opacity:1}88.75%{opacity:0}90%{opacity:1}91.25%{opacity:0}100%{opacity:0}}
@keyframes hit{0%{opacity:0}15%{opacity:1}18.75%{opacity:0}100%{opacity:0}}
@keyframes look{0%{transform:translate(0px,0px)}5%{transform:translate(0px,-2.4px)}25%{transform:translate(1.4px,1.8px)}45%{transform:translate(0px,0px)}80%{transform:translate(1.4px,1.8px)}92.5%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
@keyframes lids{0%{transform:scale(1,1)}5%{transform:scale(1.2,1.2)}15%{transform:scale(1,0.08)}25%{transform:scale(1,1)}45%{transform:scale(1,0.5)}61.25%{transform:scale(1,0.08)}63.75%{transform:scale(1,0.5)}80%{transform:scale(1,0.7)}92.5%{transform:scale(1,1)}100%{transform:scale(1,1)}}
@keyframes brows{0%{transform:translateY(0)}5%{transform:translateY(-2.5px)}15%{transform:translateY(2px)}25%{transform:translateY(0)}45%{transform:translateY(2.4px)}92.5%{transform:translateY(0)}100%{transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(14 16)"><g class="gizmo"><path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g><g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/><g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g></g><g class="hit" stroke="#e9f1fb" stroke-width="1.8" stroke-linecap="square"><path d="M20 4 l-4 -3 M44 4 l4 -3 M17 10 h-5 M47 10 h5"/></g><g class="die"><rect x="-6.5" y="-6.5" width="13" height="13" rx="2.5" fill="#07090d" stroke="#e9f1fb" stroke-width="1.8"/><rect x="-2" y="-2" width="4" height="4" fill="#ff3b4e"/></g></g>
</svg>
