<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="320" height="400" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Street Victory</title>
<desc id="desc">Gizmo crouches, launches, and whips through a full spin in the air. He lands, leans back with one brow cocked, snaps his lower tip out and up into a curled fist, and pumps it twice while pixel glints flash. Mid-pose he freezes with wide eyes, looks left and then right, slowly reels the fist back in, and carefully straightens into his usual composed posture. Four second loop on a transparent background.</desc>
<style>
.hop{transform-origin:40px 90px;animation:hop 4s linear infinite}
.spin{transform-origin:40px 56px;animation:spin 4s linear infinite}
.arm{stroke-dasharray:100 300;stroke-dashoffset:103;transform-origin:19px 76px;animation:reach 4s linear infinite,pump 4s ease-in-out infinite}
.dust,.g1,.g2{opacity:0;animation:4s steps(1,end) infinite}
.dust{animation-name:dust}.g1{animation-name:g1}.g2{animation-name:g2}
.eyes{transform-origin:33px 41px;animation:lids 4s linear infinite}
.pupils{animation:look 4s ease-in-out infinite}
.brow-l{animation:browL 4s ease-in-out infinite}
.brow-r{animation:browR 4s ease-in-out infinite}
@keyframes hop{
0%,5%{transform:translateY(0) rotate(0) scale(1,1);animation-timing-function:ease-in-out}
10%{transform:translateY(0) rotate(0) scale(1.1,.85);animation-timing-function:cubic-bezier(.2,.8,.4,1)}
12.5%{transform:translateY(-3px) rotate(0) scale(1,1);animation-timing-function:cubic-bezier(.1,.5,.5,1)}
20%{transform:translateY(-12px) rotate(0) scale(1,1);animation-timing-function:cubic-bezier(.5,0,.9,.5)}
28%{transform:translateY(0) rotate(0) scale(1,1)}
30%{transform:translateY(0) rotate(0) scale(1.12,.84);animation-timing-function:ease-out}
33%{transform:translateY(0) rotate(-3deg) scale(.97,1.04);animation-timing-function:ease-in-out}
36.5%{transform:translateY(0) rotate(-8deg) scale(1,1);animation-timing-function:ease-in-out}
40%{transform:translateY(0) rotate(-10deg) scale(1,1.03);animation-timing-function:ease-in-out}
44%{transform:translateY(0) rotate(-8deg) scale(1,1);animation-timing-function:ease-in-out}
48%{transform:translateY(0) rotate(-10deg) scale(1,1.03);animation-timing-function:ease-in-out}
52%,79%{transform:translateY(0) rotate(-8deg) scale(1,1);animation-timing-function:ease-in-out}
87%{transform:translateY(0) rotate(0) scale(1,1.02);animation-timing-function:ease-in-out}
93%,100%{transform:translateY(0) rotate(0) scale(1,1)}}
@keyframes spin{
0%,11%{transform:rotate(0);animation-timing-function:cubic-bezier(.4,0,.5,1)}
28%,100%{transform:rotate(-360deg)}}
@keyframes reach{
0%{stroke-dashoffset:103}
32%{stroke-dashoffset:103;animation-timing-function:cubic-bezier(.1,.8,.3,1)}
37%{stroke-dashoffset:0}
68%{stroke-dashoffset:0;animation-timing-function:cubic-bezier(.5,0,.5,1)}
80%,100%{stroke-dashoffset:103}}
@keyframes pump{
0%,37.5%,44%,100%{transform:rotate(0)}
40%,48%{transform:rotate(-6deg)}
52%,68%{transform:rotate(-2deg)}
74%{transform:rotate(0)}}
@keyframes dust{0%{opacity:0}28.75%{opacity:1}32.5%,100%{opacity:0}}
@keyframes g1{0%{opacity:0}40%{opacity:1}43.75%,100%{opacity:0}}
@keyframes g2{0%{opacity:0}47.5%{opacity:1}51.25%,100%{opacity:0}}
@keyframes lids{
0%,5%,82%,86.5%,90.5%,100%{transform:scale(1,1)}
9%,59.9%{transform:scale(1,.6)}
60%,62%{transform:scale(1.2,1.2)}
64%,78%{transform:scale(1,.9)}
88.5%{transform:scale(1,.08)}}
@keyframes look{
0%,5%,83%,100%{transform:translate(0,0)}
9%,62%{transform:translate(-1px,-.3px)}
64.5%,69.5%{transform:translate(-3.3px,0)}
72.5%,78%{transform:translate(1.4px,0)}}
@keyframes browL{
0%,5%,83%,100%{transform:translateY(0)}
9%,31%{transform:translateY(-1.5px)}
36%,59.9%{transform:translateY(1px)}
60%,62%{transform:translateY(-3px)}
64.5%,78%{transform:translateY(-.8px)}}
@keyframes browR{
0%,5%,83%,100%{transform:translateY(0)}
9%,31%{transform:translateY(-1.5px)}
36%,59.9%{transform:translateY(-2.6px)}
60%,62%{transform:translateY(-3px)}
64.5%,78%{transform:translateY(-.8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="dust" fill="#e9f1fb"><rect x="16" y="88" width="2" height="2"/><rect x="11" y="85" width="1.5" height="1.5"/><rect x="60" y="88" width="2" height="2"/><rect x="65" y="85" width="1.5" height="1.5"/></g>
<g class="hop"><g class="spin"><g transform="translate(8 12)">
<!-- Lower tip snaps out, up, and curls over into a fist for the pump. -->
<path class="arm" pathLength="100" d="M19 76 V79 a6 6 0 0 0 6 6 H50 a5 5 0 0 0 5 -5 V40 a3.5 3.5 0 1 0 -3.5 3.5" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="brow-l" d="M22 33 l7 -3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/>
<path class="brow-r" d="M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/>
<g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/>
<g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g>
</g></g></g>
<!-- Pixel glints on each pump. -->
<g class="g1" fill="#ffcc66"><rect x="68" y="38" width="2" height="6"/><rect x="66" y="40" width="6" height="2"/></g>
<g class="g2" fill="#e9f1fb"><rect x="10" y="20" width="1.5" height="5.5"/><rect x="8" y="22" width="5.5" height="1.5"/></g>
</svg>
