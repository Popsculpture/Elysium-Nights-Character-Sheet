<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 108" width="448" height="432" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Tap Tap</title>
<desc id="desc">Gremlin Gizmo wants attention. He leans in close to the glass until he fills more of the frame, eyes wide. He raps on it twice. The second rap leaves a small white crack beside him. He glances left and right, backs off to his spot, and cackles. The crack blinks out. Four second loop on a transparent background.</desc>
<style>
.pose,.shake{transform-origin:32px 78px}.lids{transform-origin:33px 41px}.eL{transform-origin:27px 41px}.eR{transform-origin:39px 41px}.pL{transform-origin:28px 41.5px}.pR{transform-origin:40px 41.5px}
.under{stroke:#e2622b}.over{display:none}.tip{stroke:#1c5744}.bL0,.bR0{display:none}.fL,.fR{fill:#ffe9a8}.eL{transform:translate(0,1.5px) scale(.72)}.eR{transform:translate(.5px,-1px) scale(1.26)}.pL,.pR{transform:scale(.75)}
.gfl{animation:gfl 4s steps(1,end) infinite}
@keyframes gfl{0%{opacity:1}20.67%{opacity:0}21.92%{opacity:1}54.0%{opacity:0}55.25%{opacity:1}87.33%{opacity:0}88.58%{opacity:1}100%{opacity:1}}
.pose{animation:pose 4s ease-in-out infinite}.shake{animation:shake 4s steps(1,end) infinite}.look{animation:look 4s steps(1,end) infinite}.lids{animation:lids 4s steps(1,end) infinite}.brows{animation:brows 4s steps(1,end) infinite}
.zoom{transform-origin:32px 62px;animation:zoom 4s ease-in-out infinite}.tk{opacity:0;animation:tk 4s steps(1,end) infinite}.crack{opacity:0;animation:crack 4s steps(1,end) infinite}
@keyframes zoom{0%,8%{transform:scale(1);animation-timing-function:cubic-bezier(.3,0,.2,1)}16%{transform:scale(1.26);animation-timing-function:steps(1,end)}20%{transform:scale(1.36);animation-timing-function:steps(1,end)}22.5%{transform:scale(1.26);animation-timing-function:steps(1,end)}30%{transform:scale(1.36);animation-timing-function:steps(1,end)}32.5%{transform:scale(1.26);animation-timing-function:steps(1,end)}50%{transform:scale(1.26);animation-timing-function:cubic-bezier(.3,0,.2,1)}58%,100%{transform:scale(1)}}
@keyframes pose{0%,100%{transform:rotate(0deg) scale(1,1)}}
@keyframes shake{0%{transform:rotate(0)}61.250%{transform:rotate(6deg)}62.500%{transform:rotate(-6deg)}63.750%{transform:rotate(6deg)}65.000%{transform:rotate(-6deg)}66.250%{transform:rotate(6deg)}67.500%{transform:rotate(-6deg)}68.750%{transform:rotate(6deg)}70.000%{transform:rotate(-6deg)}71.250%{transform:rotate(6deg)}72.500%{transform:rotate(-6deg)}73.750%{transform:rotate(6deg)}75.000%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes tk{0%{opacity:0}20%{opacity:1}23.75%{opacity:0}30%{opacity:1}33.75%{opacity:0}100%{opacity:0}}
@keyframes crack{0%{opacity:0}30%{opacity:1}78.75%{opacity:0}80%{opacity:1}81.25%{opacity:0}100%{opacity:0}}
@keyframes look{0%{transform:translate(0px,0.3px)}36%{transform:translate(-2.6px,0.3px)}41%{transform:translate(1.4px,0.3px)}46%{transform:translate(0px,0.3px)}100%{transform:translate(0px,0.3px)}}
@keyframes lids{0%{transform:scale(1,1)}8%{transform:scale(1.15,1.15)}50%{transform:scale(1,1)}61.25%{transform:scale(1,0.4)}75%{transform:scale(1,1)}88.75%{transform:scale(1,.08)}89.95%{transform:scale(1,1)}100%{transform:scale(1,1)}}
@keyframes brows{0%{transform:translateY(1.2px)}8%{transform:translateY(-1px)}50%{transform:translateY(1.2px)}100%{transform:translateY(1.2px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(24 20)"><g class="zoom"><g class="pose"><g class="shake"><g class="gfl"><g class="s3"><path class="under" d="M19 76 V60 l-5 -7 l5 -7 V22 l4 -11 l10 -3 l8 6 l4 8 V34 l5 7 l-5 7 V62 l-4 8 l-7 -1 l-3 -7 V40" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/><path class="over" d="M19 76 V60 l-5 -7 l5 -7 V22 l4 -11 l10 -3 l8 6 l4 8 V34 l5 7 l-5 7 V62 l-4 8 l-7 -1 l-3 -7 V40" pathLength="100" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/><path class="tip" d="M31 40 V30" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter"/></g><g class="brows" fill="none" stroke-width="2.3" stroke-linecap="round"><path class="bL0" d="M22 33 l7 -3" stroke="#2ee6a0"/><path class="bR0" d="M44 30 l-7 3" stroke="#2ee6a0"/><path class="bL1" d="M18.5 34 l3.5 -3 l3 3 l3 -3.5" stroke="#e2622b" stroke-linejoin="miter"/><path class="bR1" d="M34.5 31 l3 -3 l3.5 3 l3 -3.5 l2.5 3" stroke="#e2622b" stroke-linejoin="miter"/></g><g class="lids"><g class="eL"><circle class="fL" cx="27" cy="41" r="4.6"/><g class="look"><g class="pL"><circle cx="28" cy="41.5" r="2" fill="#07090d"/></g></g></g><g class="eR"><circle class="fR" cx="39" cy="41" r="4.6"/><g class="look"><g class="pR"><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g></g></g></g></g></g></g><g class="tk" stroke="#e9f1fb" stroke-width="1.6" stroke-linecap="square" fill="none"><path d="M4 10 l-4 -3 M8 0 l-3 -4 M60 10 l4 -3 M56 0 l3 -4"/></g><path class="crack" d="M62 2 l4 6 l-2 5 l6 7 M66 8 l6 -2 M64 13 l-6 4 M70 20 l5 1" fill="none" stroke="#e9f1fb" stroke-width="1.5" stroke-linejoin="miter"/></g>
</svg>
