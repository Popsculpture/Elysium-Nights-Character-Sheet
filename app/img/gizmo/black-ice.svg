<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 92" width="336" height="368" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Black ICE</title>
<desc id="desc">A red bolt strikes Gizmo from the upper right. He flashes red and breaks into twelve chunky blocks that tumble into a heap. One eye blinks and looks around from the top of the pile. The blocks rise and restack in the wrong order, with his lower curve on top and his eyes swapped. His eyes look down at himself, go wide, and he shudders, then snaps back into the right order and holds a rattled stare. Eight second loop on a transparent background.</desc>
