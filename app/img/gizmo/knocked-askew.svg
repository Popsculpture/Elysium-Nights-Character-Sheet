@keyframes look{0%,5%,95%,100%{transform:translate(0,0)}6.5%,18%{transform:translate(-3.3px,.2px)}19.5%,21.5%{transform:translate(-.5px,1.8px)}22.5%,27%{transform:translate(-1px,-.3px)}28.5%,39.5%{transform:translate(1.4px,.2px)}41%,46.5%{transform:translate(-1px,-.3px)}48.5%,52%{transform:translate(-3.3px,.2px)}55.5%,64%{transform:translate(1.4px,-.3px)}69%,81%{transform:translate(-3.3px,0)}82.5%,86.5%{transform:translate(-3px,1.5px)}88%,92.5%{transform:translate(-3.3px,.8px)}}
@keyframes brows{0%,9.5%,26%,30.5%,69%,80.8%,95%,100%{transform:translateY(0)}10%,11.8%{transform:translateY(-3px)}13.5%,24%{transform:translateY(1.5px)}31.5%,33.2%{transform:translateY(-3px)}35%,50%{transform:translateY(2px)}52%,54.5%{transform:translateY(-3px)}56%,67%{transform:translateY(2.4px)}83.5%,92%{transform:translateY(-1.3px)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
