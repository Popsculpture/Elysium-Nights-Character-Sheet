<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" width="480" height="384" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Knocked Askew</title>
<desc id="desc">The Gremlin leans in from the left and shoves Gizmo, leaving him tilted like a crooked picture. It cackles and leaves, and he straightens himself. It shoves him from the right and he straightens again, slower. The third time it flips him clean upside down and he lands on his head. He hops and rights himself, then stands still with his eyes half shut, watching. When the Gremlin sneaks in and lunges, he steps aside. It falls flat on its side. He nudges it out of the frame as he steps back to his spot. Nine second loop on a transparent background.</desc>
<style>
.gflick{animation:gflick 1.3s steps(1,end) infinite}.ge{transform-origin:33px 43px}@keyframes gflick{0%{opacity:1;transform:translateX(0)}90%{opacity:0}93.5%{opacity:1;transform:translateX(1px)}97%,100%{opacity:1;transform:translateX(0)}}

.gslide{animation:gslide 9s ease-in-out infinite}
.flip{transform-origin:32px 42.5px;animation:flip 9s ease-in-out infinite}
.gizmo{transform-origin:32px 78px;animation:tilt 9s ease-in-out infinite}
.gpos{transform:translate(-46px,40px);animation:gpos 9s ease-in-out infinite}
.gfall{transform-origin:30px 48px;animation:gfall 9s ease-in-out infinite}
.gcack{transform-origin:20px 48px;animation:gcack 9s steps(1,end) infinite}
.ge{animation:ge 9s steps(1,end) infinite}
.gp{animation:gp 9s steps(1,end) infinite}
.dust{opacity:0;animation:dust 9s steps(1,end) infinite}
.eyes{transform-origin:33px 41px;animation:lids 9s linear infinite}
.pupils{animation:look 9s ease-in-out infinite}
.brows{animation:brows 9s ease-in-out infinite}
@keyframes gslide{0%,51.5%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}53.2%{transform:translate(0px,-8px);animation-timing-function:cubic-bezier(.6,0,.9,.4)}55%,64%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(.1,.6,.4,1)}66%{transform:translate(0px,-8px);animation-timing-function:cubic-bezier(.6,0,.9,.4)}68%,81.2%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(.2,.8,.3,1)}82.4%,87%{transform:translate(16px,0px)}90.5%,100%{transform:translate(0px,0px)}}
@keyframes flip{0%,52%{transform:rotate(0)}55%,64%{transform:rotate(180deg)}68%,100%{transform:rotate(360deg)}}
@keyframes tilt{0%,10%{transform:rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.2,.8,.3,1)}11.5%{transform:rotate(20deg) scale(1,1)}13%{transform:rotate(15deg) scale(1,1)}14.5%,21.5%{transform:rotate(17deg) scale(1,1)}24.5%{transform:rotate(-3deg) scale(1,1)}26%,31.4%{transform:rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.2,.8,.3,1)}33%{transform:rotate(-26deg) scale(1,1)}34.5%{transform:rotate(-20deg) scale(1,1)}36%,42%{transform:rotate(-22deg) scale(1,1)}46%{transform:rotate(3deg) scale(1,1)}47.5%,54.5%{transform:rotate(0deg) scale(1,1)}55.3%{transform:rotate(0deg) scale(1.1,0.88)}57%,67.6%{transform:rotate(0deg) scale(1,1)}68.4%{transform:rotate(0deg) scale(1.08,0.9)}70%,81.2%{transform:rotate(0deg) scale(1,1);animation-timing-function:cubic-bezier(.2,.8,.3,1)}82.4%,86.5%{transform:rotate(8deg) scale(1,1)}88.5%{transform:rotate(-6deg) scale(1,1)}91%,100%{transform:rotate(0deg) scale(1,1)}}
