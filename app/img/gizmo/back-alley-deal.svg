<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 104" width="256" height="416" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Back-Alley Deal</title>
<desc id="desc">Gizmo looks left, pauses, and looks right. He hunches forward, slides a tiny purple data chip out from behind his body, and nudges it toward the viewer with his lower tip. He snaps upright with wide innocent eyes and raised brows while the chip grows and slips past the bottom edge, sneaks one glance down, then keeps looking up and away as two tiny musical notes appear and vanish. He returns to neutral. Six second loop on a transparent background.</desc>
<style>
.gizmo{transform-origin:32px 78px;animation:pose 6s ease-in-out infinite}
.foot{transform-origin:19px 54px;animation:foot 6s ease-in-out infinite}
.chip{transform:translate(19px,70px);animation:chip 6s ease-in-out infinite}
.chip-vis{opacity:0;animation:chipvis 6s steps(1,end) infinite}
.eyes{transform-origin:33px 41px;animation:lids 6s linear infinite}
.pupils{animation:look 6s ease-in-out infinite}
.brows{animation:brows 6s ease-in-out infinite}
@keyframes pose{
0%,3.33%{transform:rotate(0) scale(1,1)}
6.67%,18.33%{transform:rotate(-2deg) scale(1,1)}
21.67%,27.5%{transform:rotate(2deg) scale(1,1)}
32.5%,37.5%{transform:rotate(4deg) scale(1.04,.9)}
38.75%{transform:rotate(5deg) scale(1.05,.88)}
43.33%{transform:rotate(0) scale(.98,1.06)}
47.5%{transform:rotate(-1.5deg) scale(1,1.03)}
55%{transform:rotate(1.5deg) scale(1,1.03)}
63.33%{transform:rotate(-1.5deg) scale(1,1.03)}
71.5%{transform:rotate(1.5deg) scale(1,1.03)}
80%{transform:rotate(-1.5deg) scale(1,1.03)}
88%{transform:rotate(0) scale(1,1.03)}
92.5%,100%{transform:rotate(0) scale(1,1)}}
@keyframes foot{
0%,34.17%{transform:rotate(0)}
37.08%{transform:rotate(10deg);animation-timing-function:cubic-bezier(.4,0,.2,1)}
38.75%{transform:rotate(-14deg)}
41.67%{transform:rotate(3deg)}
44.17%,100%{transform:rotate(0)}}
@keyframes chip{
0%,31.67%{transform:translate(19px,70px) scale(1)}
36.67%{transform:translate(27px,76.5px) scale(1)}
38.33%{transform:translate(27px,76.5px) scale(1);animation-timing-function:linear}
65.83%,100%{transform:translate(37px,117px) scale(3.2)}}
@keyframes chipvis{0%{opacity:0}31.67%{opacity:1}66.25%,100%{opacity:0}}
@keyframes lids{
0%,11.25%,13.75%,27.5%,91%,92.12%,95.12%,100%{transform:scale(1,1)}
12.5%,93.62%{transform:scale(1,.08)}
32.5%,38.75%{transform:scale(1,.55)}
42.08%{transform:scale(1.28,1.28)}
45%,88%{transform:scale(1.18,1.18)}}
@keyframes look{
0%,3.33%,91.75%,100%{transform:translate(0,0)}
6.67%,18.33%{transform:translate(-3.3px,0)}
21.67%,27.5%{transform:translate(1.4px,0)}
31.67%{transform:translate(-1px,-.3px)}
35%,38.75%{transform:translate(-.6px,1.6px)}
42.5%,52.92%{transform:translate(-2.4px,-2.4px)}
54.58%,56.25%{transform:translate(.5px,1.5px)}
58.33%,88%{transform:translate(-2.4px,-2.4px)}}
@keyframes brows{
0%,27.5%,91.75%,100%{transform:translateY(0)}
31.67%,38.75%{transform:translateY(1.6px)}
42.5%,88%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.n1,.n2{opacity:0}
.n1{animation:n1 6s steps(1,end) infinite}
.n2{animation:n2 6s steps(1,end) infinite}
@keyframes n1{0%{opacity:0;transform:translate(0,0)}68%{opacity:1;transform:translate(0,0)}72.5%{opacity:1;transform:translate(1px,-2px)}77%{opacity:1;transform:translate(0,-4px)}81.5%,100%{opacity:0;transform:translate(0,-4px)}}
@keyframes n2{0%{opacity:0;transform:translate(0,0)}72.5%{opacity:1;transform:translate(0,0)}77%{opacity:1;transform:translate(-1px,-2px)}81.5%{opacity:1;transform:translate(0,-4px)}86%,100%{opacity:0;transform:translate(0,-4px)}}
</style>
<!-- The chip starts tucked behind his left tube and stays behind him in the stack. -->
<g class="chip-vis"><g class="chip">
<path d="M-1 -3.4 v6.8 M1 -3.4 v6.8" stroke="#b893ff" stroke-width=".7"/>
<rect x="-1.8" y="-2.75" width="3.6" height="5.5" fill="#b893ff" stroke="#07090d" stroke-width=".4"/>
<rect x="-.8" y="-.9" width="1.6" height="1.8" fill="#07090d"/>
</g></g>
<g class="gizmo">
<!-- Body starts partway down the left tube; the foot piece overlaps it and swings from that joint. -->
<path d="M19 60 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="foot" d="M19 54 V76" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round"/>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/>
<g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g>
</g>
<g class="n1" fill="#ffcc66"><g transform="translate(50 7)"><rect x="2" y="0" width="1" height="5"/><rect x="0" y="4" width="2" height="2"/><rect x="3" y="0" width="2" height="1.2"/></g></g>
<g class="n2" fill="#ffcc66"><g transform="translate(56 14)"><rect x="2" y="0" width="1" height="5"/><rect x="0" y="4" width="2" height="2"/><rect x="3" y="0" width="2" height="1.2"/></g></g>
</svg>
