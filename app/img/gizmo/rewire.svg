5.5%,11%{transform:translateY(1px)}
12.5%,17%{transform:translateY(-3px)}
83%,91%{transform:translateY(-1px)}
92.5%,95%{transform:translateY(-1.5px)}}
@keyframes flids{
0%,36%,41.5%,44%,60%,64%,100%{transform:scale(1,1)}
37%,41%{transform:scale(1.15,1.15)}
44.5%,47.5%{transform:scale(1.2,1.2)}
64.5%,68%{transform:scale(1,.5)}
68.5%,71.5%{transform:scale(1.2,1.2)}}
@keyframes flook{
0%,37.5%,57%,61%,100%{transform:translate(0,0)}
38.5%,41%{transform:translate(-.6px,1.8px)}
42%,44%{transform:translate(-1px,-.3px)}
44.6%,48%{transform:translate(1.4px,0)}
62%,64%{transform:translate(-.6px,1.8px)}
65%,68%{transform:translate(-1px,-.3px)}
68.6%,72%{transform:translate(1.4px,0)}}
@keyframes fbrows{
0%,37%,57%,64%,100%{transform:translateY(0)}
38.5%,47.5%{transform:translateY(-2.2px)}
65%,68%{transform:translateY(2px)}
68.6%,72%{transform:translateY(-2.5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(8 6)">
<g class="live">
<path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/>
<g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g>
</g>
<!-- Pulled straight: one line with his eyes still on it. -->
<g class="wire">
<path d="M32 8 V78" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round"/>
<g transform="translate(32 26) scale(.7) translate(-33 -41)"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="28.4" cy="41.5" r="2" fill="#07090d"/><circle cx="40.4" cy="41.5" r="2" fill="#07090d"/></g>
</g>
<!-- Wrong shapes, same wire. -->
<g class="star"><path d="M32.00 21.00 L38.17 36.51 L54.83 37.58 L41.99 48.24 L46.11 64.42 L32.00 55.50 L17.89 64.42 L22.01 48.24 L9.17 37.58 L25.83 36.51 Z" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linejoin="round"/><path class="fbrows" d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/><g class="feyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/><g class="fpupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g></g>
<g class="clef"><path d="M27 72 a4.5 4.5 0 1 0 8 3 L31 18 C30 6 42 6 40 18 C38 28 20 34 20 46 C20 58 42 60 42 48 C42 40 30 38 29 47" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path class="fbrows" d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/><g class="feyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/><g class="fpupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/></g></g></g>
<!-- Bending rig, in front so things vanish into its slot. -->
<g class="rig"><g class="shake">
<rect x="66" y="44" width="31" height="40" fill="#6b7c93" stroke="#07090d" stroke-width=".6"/>
<rect x="66" y="56" width="3" height="11" fill="#07090d"/>
