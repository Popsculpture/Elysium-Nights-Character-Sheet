<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 92" width="416" height="368" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Rewire</title>
<desc id="desc">A small bending rig slides in beside Gizmo. He is pulled thin into a straight wire that tips over and feeds into the rig. The rig rattles and he hops out bent into a star, confused. It pulls him back in and he comes out as a treble clef, unimpressed. It pulls him in a third time and he comes out as a paperclip. He checks himself over and the rig backs out. Nine second loop on a transparent background.</desc>
<style>
.live{transform-origin:32px 44px;animation:live 9s ease-in-out infinite,livev 9s steps(1,end) infinite}
.wire{opacity:0;transform-origin:32px 43px;animation:wire 9s ease-in-out infinite,wirev 9s steps(1,end) infinite}
.star{opacity:0;transform-origin:32px 44px;animation:star 9s ease-in-out infinite,starv 9s steps(1,end) infinite}@keyframes star{0%,33%{transform:translate(50px,16px) scale(.15,.15);animation-timing-function:cubic-bezier(.2,.7,.4,1)}34.8%{transform:translate(22px,-6px) scale(.7,.7);animation-timing-function:cubic-bezier(.5,0,.8,.6)}36.5%{transform:translate(0,0) scale(1.08,.9)}38%{transform:translate(0,0) scale(1,1)}44.5%{transform:translate(0,0) scale(1,1);animation-timing-function:cubic-bezier(.6,0,1,.6)}47.5%,100%{transform:translate(50px,16px) scale(.15,.15)}}@keyframes starv{0%{opacity:0}33%{opacity:1}47.5%,100%{opacity:0}}
.clef{opacity:0;transform-origin:32px 44px;animation:clef 9s ease-in-out infinite,clefv 9s steps(1,end) infinite}@keyframes clef{0%,56.5%{transform:translate(50px,16px) scale(.15,.15);animation-timing-function:cubic-bezier(.2,.7,.4,1)}58.3%{transform:translate(22px,-6px) scale(.7,.7);animation-timing-function:cubic-bezier(.5,0,.8,.6)}60.0%{transform:translate(0,0) scale(1.08,.9)}61.5%{transform:translate(0,0) scale(1,1)}68.5%{transform:translate(0,0) scale(1,1);animation-timing-function:cubic-bezier(.6,0,1,.6)}71.5%,100%{transform:translate(50px,16px) scale(.15,.15)}}@keyframes clefv{0%{opacity:0}56.5%{opacity:1}71.5%,100%{opacity:0}}
.rig{transform:translateX(44px);animation:rig 9s ease-in-out infinite}
.shake{animation:shake 9s steps(1,end) infinite}
.run,.ding{opacity:0;animation:9s steps(1,end) infinite}
.run{animation-name:run}.ding{animation-name:ding}
.blink{animation:blink .2s steps(1,end) infinite}
.blink2{animation:blink2 .2s steps(1,end) infinite}
.eyes{transform-origin:33px 41px;animation:lids 9s linear infinite}
.pupils{animation:look 9s ease-in-out infinite}
.brows{animation:brows 9s ease-in-out infinite}
.feyes{transform-origin:33px 41px;animation:flids 9s linear infinite}
.fpupils{animation:flook 9s ease-in-out infinite}
.fbrows{animation:fbrows 9s ease-in-out infinite}
@keyframes live{
0%,12%,84.5%,100%{transform:translate(0,0) scale(1,1)}
14%{transform:translate(0,0) scale(1.05,.95);animation-timing-function:cubic-bezier(.5,0,1,.7)}
17%{transform:translate(0,0) scale(.1,1.22)}
17.1%,79.5%{transform:translate(50px,16px) scale(.15,.15);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
81.3%{transform:translate(22px,-6px) scale(.7,.7);animation-timing-function:cubic-bezier(.5,0,.8,.6)}
83%{transform:translate(0,0) scale(1.08,.9)}}
@keyframes livev{0%{opacity:1}17%{opacity:0}79.5%,100%{opacity:1}}
@keyframes wire{
0%,17.5%{transform:translate(0,0) rotate(0)}
21.5%{transform:translate(0,18px) rotate(90deg);animation-timing-function:cubic-bezier(.5,0,1,.7)}
26%,100%{transform:translate(82px,18px) rotate(90deg)}}
