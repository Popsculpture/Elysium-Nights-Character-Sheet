<g class="run"><g class="blink"><path d="M73.5 58 H82.5 M83.5 71 H92.5" stroke="#e9f1fb" stroke-width="1.4"/></g><g class="blink2"><path d="M74.8 54.8 L81.2 61.2 M84.8 67.8 L91.2 74.2" stroke="#e9f1fb" stroke-width="1.4"/></g></g>
<rect x="90" y="47" width="3.5" height="3.5" fill="#07090d"/>
<g class="run"><rect class="blink" x="90" y="47" width="3.5" height="3.5" fill="#ff3b4e"/></g>
<rect class="ding" x="90" y="47" width="3.5" height="3.5" fill="#a6ff4d"/>
</g></g>
</g>
</svg>
