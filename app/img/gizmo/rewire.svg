@keyframes shake{0%{transform:translateX(0)}26.111%{transform:translateX(0.6px)}26.667%{transform:translateX(-0.6px)}27.222%{transform:translateX(0.6px)}27.778%{transform:translateX(-0.6px)}28.333%{transform:translateX(0.6px)}28.889%{transform:translateX(-0.6px)}29.444%{transform:translateX(0.6px)}30.000%{transform:translateX(-0.6px)}30.556%{transform:translateX(0.6px)}31.111%{transform:translateX(-0.6px)}31.667%{transform:translateX(0.6px)}32.222%{transform:translateX(-0.6px)}32.778%{transform:translateX(0.6px)}33.333%{transform:translateX(0)}48.333%{transform:translateX(0.6px)}48.889%{transform:translateX(-0.6px)}49.444%{transform:translateX(0.6px)}50.000%{transform:translateX(-0.6px)}50.556%{transform:translateX(0.6px)}51.111%{transform:translateX(-0.6px)}51.667%{transform:translateX(0.6px)}52.222%{transform:translateX(-0.6px)}52.778%{transform:translateX(0.6px)}53.333%{transform:translateX(-0.6px)}53.889%{transform:translateX(0.6px)}54.444%{transform:translateX(-0.6px)}55.000%{transform:translateX(0.6px)}55.556%{transform:translateX(-0.6px)}56.111%{transform:translateX(0.6px)}56.667%{transform:translateX(0)}72.222%{transform:translateX(0.6px)}72.778%{transform:translateX(-0.6px)}73.333%{transform:translateX(0.6px)}73.889%{transform:translateX(-0.6px)}74.444%{transform:translateX(0.6px)}75.000%{transform:translateX(-0.6px)}75.556%{transform:translateX(0.6px)}76.111%{transform:translateX(-0.6px)}76.667%{transform:translateX(0.6px)}77.222%{transform:translateX(-0.6px)}77.778%{transform:translateX(0.6px)}78.333%{transform:translateX(-0.6px)}78.889%{transform:translateX(0.6px)}79.444%{transform:translateX(-0.6px)}80.000%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes run{0%{opacity:0}26%{opacity:1}33%{opacity:0}48%{opacity:1}56.5%{opacity:0}72%{opacity:1}79.5%{opacity:0}100%{opacity:0}}
@keyframes ding{0%{opacity:0}33%{opacity:1}36.5%{opacity:0}56.5%{opacity:1}60.0%{opacity:0}79.5%{opacity:1}83.0%{opacity:0}100%{opacity:0}}
@keyframes blink{0%{opacity:1}50%,100%{opacity:0}}
@keyframes blink2{0%{opacity:0}50%,100%{opacity:1}}
@keyframes lids{
