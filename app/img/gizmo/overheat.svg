<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 104" width="336" height="416" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Overheat</title>
<desc id="desc">Gizmo starts to vibrate, and the vibration builds into a tight, rapid shake. His eyes brighten and quick pulses race around his outline. The shake cuts out and a stepped pixel-smoke puff rises above him. His lower tip curls up beside him, produces a tiny warning panel, and flaps it like a fan while he cools down. The panel and tip retract and he returns to neutral. Six second loop on a transparent background.</desc>
<style>
.lean{transform-origin:52px 94px;animation:lean 6s ease-in-out infinite}
.shake{animation:shake 6s steps(1,end) infinite}
.pulse{stroke-dasharray:10 40 10 300;stroke-dashoffset:62;animation:pulse 6s linear infinite}
.bright,.wind-a,.wind-b,.s1,.s2,.s3,.s4{opacity:0;animation:6s steps(1,end) infinite}
.bright{animation-name:bright}.wind-a{animation-name:windA}.wind-b{animation-name:windB}
.s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
.arm{stroke-dasharray:100 300;stroke-dashoffset:103;animation:arm 6s linear infinite}
.panel{transform-origin:2px 64px;transform:scale(0);animation:panel 6s ease-out infinite}
.fan{transform-origin:2px 64px;animation:fan 6s ease-in-out infinite}
.eyes{transform-origin:33px 41px;animation:lids 6s linear infinite}
.pupils{animation:look 6s ease-in-out infinite}
.brows{animation:brows 6s ease-in-out infinite}
@keyframes shake{0%{transform:translate(0,0)}3.33%{transform:translate(-0.27px,0px)}4.17%{transform:translate(-0.31px,0px)}5.00%{transform:translate(0.35px,0px)}5.83%{transform:translate(0.39px,0px)}6.67%{transform:translate(-0.43px,0px)}7.50%{transform:translate(-0.48px,0px)}8.33%{transform:translate(0.52px,0px)}9.17%{transform:translate(0.56px,0px)}10.00%{transform:translate(-0.6px,0px)}10.83%{transform:translate(-0.64px,0px)}11.67%{transform:translate(0.68px,0px)}12.50%{transform:translate(0.73px,0px)}13.33%{transform:translate(-0.77px,0px)}14.17%{transform:translate(0.9px,0.3px)}15.00%{transform:translate(-0.92px,-0.3px)}15.83%{transform:translate(0.94px,-0.3px)}16.67%{transform:translate(-0.96px,0.3px)}17.50%{transform:translate(0.98px,0.3px)}18.33%{transform:translate(-1.0px,-0.3px)}19.17%{transform:translate(1.02px,-0.3px)}20.00%{transform:translate(-1.04px,0.3px)}20.83%{transform:translate(1.06px,0.3px)}21.67%{transform:translate(-1.08px,-0.3px)}22.50%{transform:translate(1.1px,-0.3px)}23.33%{transform:translate(-1.12px,0.3px)}24.17%{transform:translate(1.14px,0.3px)}25.00%{transform:translate(-1.16px,-0.3px)}25.83%{transform:translate(1.18px,-0.3px)}26.67%{transform:translate(-1.19px,0.3px)}27.50%{transform:translate(1.21px,0.3px)}28.33%{transform:translate(-1.23px,-0.3px)}29.17%{transform:translate(1.25px,-0.3px)}30.00%{transform:translate(-1.27px,0.3px)}30.83%{transform:translate(1.29px,0.3px)}31.67%{transform:translate(-1.31px,-0.3px)}32.50%{transform:translate(1.33px,-0.3px)}33.33%{transform:translate(-1.35px,0.3px)}34.17%{transform:translate(1.37px,0.3px)}35.00%{transform:translate(-1.39px,-0.3px)}35.83%{transform:translate(0px,0px)}100%{transform:translate(0,0)}}
@keyframes fan{0%,60%{transform:rotate(0)}62.5%{transform:rotate(24deg)}65.0%{transform:rotate(-18deg)}67.5%{transform:rotate(24deg)}70.0%{transform:rotate(-18deg)}72.5%{transform:rotate(24deg)}75.0%{transform:rotate(-18deg)}77.5%{transform:rotate(24deg)}80.0%{transform:rotate(-18deg)}81.5%,100%{transform:rotate(0)}}
@keyframes lean{
0%,6%,92%,100%{transform:rotate(0) scale(1,1)}
14%,35.5%{transform:rotate(0) scale(.99,1.02)}
37%{transform:rotate(0) scale(.97,1.06)}
41%{transform:rotate(0) scale(1.02,.96)}
46%,56%{transform:rotate(0) scale(1,.97)}
61%,80%{transform:rotate(-3deg) scale(1,.98)}
86%{transform:rotate(0) scale(1,1.01)}}
@keyframes pulse{
0%,16%{stroke-dashoffset:62}22.49%{stroke-dashoffset:-104}
22.5%{stroke-dashoffset:62}28.99%{stroke-dashoffset:-104}
29%{stroke-dashoffset:62}35.5%,100%{stroke-dashoffset:-104}}
@keyframes bright{0%{opacity:0}14%{opacity:1}36%,100%{opacity:0}}
@keyframes s1{0%{opacity:0}36%{opacity:1}39.5%,100%{opacity:0}}
@keyframes s2{0%{opacity:0}39.5%{opacity:1}43.5%,100%{opacity:0}}
@keyframes s3{0%{opacity:0}43.5%{opacity:1}48%,100%{opacity:0}}
@keyframes s4{0%{opacity:0}48%{opacity:1}52.5%,100%{opacity:0}}
@keyframes windA{0%{opacity:0}62.5%,67.5%,72.5%,77.5%{opacity:1}65%,70%,75%,80%,100%{opacity:0}}
@keyframes windB{0%{opacity:0}65%,70%,75%{opacity:1}67.5%,72.5%,77.5%,100%{opacity:0}}
@keyframes arm{
0%{stroke-dashoffset:103}
46%{stroke-dashoffset:103;animation-timing-function:cubic-bezier(.2,.7,.3,1)}
54%{stroke-dashoffset:0}
83%{stroke-dashoffset:0;animation-timing-function:cubic-bezier(.6,0,.9,.5)}
90%,100%{stroke-dashoffset:103}}
@keyframes panel{
0%,54%{transform:scale(0)}
55.5%{transform:scale(1.2)}
57%,81.5%{transform:scale(1)}
83%,100%{transform:scale(0)}}
@keyframes lids{
0%,3%,55%,58%,88%,90.5%,94.5%,100%{transform:scale(1,1)}
8%{transform:scale(1.05,1.05)}
14%,35.5%{transform:scale(1.15,1.15)}
37%{transform:scale(1.3,1.3)}
42%,52%{transform:scale(1,.45)}
62%,80%{transform:scale(1,.3)}
84%{transform:scale(1,.7)}
92.5%{transform:scale(1,.08)}}
@keyframes look{
0%,3%,87%,100%{transform:translate(0,0)}
6%,35.5%{transform:translate(-1px,-.5px)}
37.5%,44%{transform:translate(-1px,-2.4px)}
47%,52%{transform:translate(-2.6px,1.2px)}
54.5%,59%{transform:translate(-3.1px,.9px)}
62%,81%{transform:translate(-1px,-.3px)}}
@keyframes brows{
0%,3%,88%,100%{transform:translateY(0)}
6%,13%{transform:translateY(.8px)}
15%,35.5%{transform:translateY(1.8px)}
37%{transform:translateY(-3px)}
42%,53%{transform:translateY(-.5px)}
55.5%,58.5%{transform:translateY(-2.2px)}
62%,80%{transform:translateY(-1.5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Stepped pixel smoke: four hard frames, no fades. -->
<g class="s1"><rect x="50" y="16" width="4" height="4" fill="#e9f1fb"/><rect x="54" y="18" width="2" height="2" fill="#6b7c93"/></g>
<g class="s2"><rect x="47" y="11" width="4" height="4" fill="#e9f1fb"/><rect x="51" y="9" width="5" height="5" fill="#e9f1fb"/><rect x="56" y="12" width="3" height="3" fill="#6b7c93"/><rect x="50" y="15" width="2" height="2" fill="#6b7c93"/></g>
<g class="s3"><rect x="45" y="5" width="3" height="3" fill="#6b7c93"/><rect x="50" y="3" width="4" height="4" fill="#e9f1fb"/><rect x="56" y="5" width="3" height="3" fill="#e9f1fb"/><rect x="53" y="9" width="2" height="2" fill="#6b7c93"/><rect x="47" y="10" width="2" height="2" fill="#e9f1fb"/></g>
<g class="s4"><rect x="44" y="1" width="2" height="2" fill="#e9f1fb"/><rect x="51" y="0" width="2" height="2" fill="#6b7c93"/><rect x="58" y="2" width="2" height="2" fill="#e9f1fb"/></g>
<g class="lean"><g class="shake"><g transform="translate(20 16)">
<!-- The lower tip curls up his left side to hold the panel. -->
<path class="arm" pathLength="100" d="M19 76 V78 a5 5 0 0 1 -5 5 H7 a5 5 0 0 1 -5 -5 V64" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#2ee6a0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="pulse" pathLength="100" d="M19 76 V22 a13 13 0 0 1 26 0 V62 a7 7 0 0 1 -14 0 V30" fill="none" stroke="#ffffff" stroke-width="4.5"/>
<g class="brows"><path d="M22 33 l7 -3 M44 30 l-7 3" stroke="#2ee6a0" stroke-width="2.2" stroke-linecap="round"/></g>
<g class="eyes"><circle cx="27" cy="41" r="4.6" fill="#e9f1fb"/><circle cx="39" cy="41" r="4.6" fill="#e9f1fb"/>
<g class="bright" fill="#ffffff" stroke="#2ee6a0" stroke-width="1"><circle cx="27" cy="41" r="4.6"/><circle cx="39" cy="41" r="4.6"/></g>
<g class="pupils"><circle cx="28" cy="41.5" r="2" fill="#07090d"/><circle cx="40" cy="41.5" r="2" fill="#07090d"/>
<g class="bright" fill="#ffffff"><rect x="27" y="40" width="1.1" height="1.1"/><rect x="39" y="40" width="1.1" height="1.1"/></g></g></g>
<g class="wind-a" fill="#e9f1fb"><rect x="10" y="45" width="3" height="1"/><rect x="12" y="53" width="3" height="1"/></g>
<g class="wind-b" fill="#e9f1fb"><rect x="12" y="48" width="3" height="1"/><rect x="10" y="56" width="3" height="1"/></g>
<g class="panel"><g class="fan">
<rect x="-4.5" y="50" width="13" height="11" fill="#ffcc66" stroke="#07090d" stroke-width=".6"/>
<rect x="1.2" y="52" width="1.6" height="4.4" fill="#07090d"/><rect x="1.2" y="57.4" width="1.6" height="1.6" fill="#07090d"/>
</g></g>
</g></g></g>
</svg>
