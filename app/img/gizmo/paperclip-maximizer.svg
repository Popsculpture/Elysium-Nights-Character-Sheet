<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" width="520" height="400" role="img" aria-labelledby="title desc">
<title id="title">Gizmo: Paperclip Maximizer</title>
<desc id="desc">A loose pixel drifts down beside Gizmo. He taps it with his lower tip and it becomes a tiny copy of himself. He looks pleased and makes a second one. Then the copies start appearing on their own, in waves: along the floor, stacked up both sides of the frame, and climbing on him. He panics. He sweeps the left side clear with his lower tip, sweeps the right side clear, and shakes the climbers off. One copy is left. He glances at the viewer, slides it behind his body, and looks at the ceiling. Ten second loop on a transparent background.</desc>
